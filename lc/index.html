<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>算法题单刷题追踪器</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github-dark.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; }
body { background:linear-gradient(135deg,#f5f7fa 0%,#c3cfe2 100%); min-height:100vh; color:#333; }
.layout { display:flex; max-width:1450px; margin:0 auto; gap:14px; padding:12px; align-items:flex-start; }
.sidebar { width:230px; flex-shrink:0; background:#fff; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,.08); position:sticky; top:12px; max-height:calc(100vh - 24px); overflow-y:auto; padding:14px 0; }
.sidebar h3 { font-size:.85rem; color:#868e96; padding:0 14px 8px; border-bottom:1px solid #eef2f7; letter-spacing:1px; }
.nav-item { display:flex; justify-content:space-between; align-items:center; padding:7px 14px; font-size:.85rem; color:#2c3e50; cursor:pointer; transition:all .15s; border-left:3px solid transparent; }
.nav-item:hover { background:#f6f9fc; }
.nav-item.active { background:#e7f2fd; border-left-color:#4A90E2; color:#1864ab; font-weight:600; }
.nav-item.l1 { font-weight:600; }
.nav-item.l2 { padding-left:30px; font-size:.8rem; color:#495057; }
.nav-count { font-size:.68rem; background:#e9ecef; color:#868e96; padding:1px 7px; border-radius:10px; margin-left:6px; white-space:nowrap; }
.nav-item.active .nav-count { background:#4A90E2; color:#fff; }
.nav-prog { height:3px; border-radius:2px; background:#dee2e6; margin-top:3px; overflow:hidden; }
.nav-prog i { display:block; height:100%; background:#37b24d; width:0; transition:width .3s; }
.main { flex:1; min-width:0; }
.container { background:#fff; border-radius:15px; box-shadow:0 10px 30px rgba(0,0,0,.1); overflow:hidden; }

/* 紧凑头部 */
header { background:linear-gradient(135deg,#4A90E2 0%,#50E3C2 100%); color:#fff; padding:10px 14px; position:relative; }
.header-row { display:flex; align-items:center; gap:12px; }
h1 { font-size:1.05rem; font-weight:600; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.subtitle { font-size:.75rem; opacity:.85; display:none; }
.stats-bar { display:flex; gap:6px; margin-left:auto; flex-shrink:0; align-items:center; }
.stat-item { background:rgba(255,255,255,.2); padding:3px 9px; border-radius:8px; text-align:center; min-width:52px; line-height:1.15; }
.stat-value { font-size:.9rem; font-weight:bold; }
.stat-label { font-size:.62rem; opacity:.9; }

/* 右上角题单下拉菜单 */
.preset-menu { position:relative; flex-shrink:0; }
.preset-btn { display:flex; align-items:center; gap:6px; padding:5px 12px; border-radius:20px; border:1px solid rgba(255,255,255,.45); background:rgba(255,255,255,.18); color:#fff; font-size:.78rem; cursor:pointer; backdrop-filter:blur(4px); transition:all .15s; max-width:220px; }
.preset-btn:hover { background:rgba(255,255,255,.3); }
.preset-btn .ptitle { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:150px; }
.preset-btn .caret { font-size:.6rem; opacity:.9; transition:transform .2s; }
.preset-menu.open .preset-btn .caret { transform:rotate(180deg); }
.preset-list { position:absolute; top:calc(100% + 6px); right:0; min-width:320px; max-width:min(92vw,420px); max-height:65vh; overflow-y:auto; background:#fff; color:#2c3e50; border-radius:12px; box-shadow:0 10px 30px rgba(0,0,0,.18); border:1px solid #eef2f7; padding:6px; display:none; z-index:200; }
.preset-menu.open .preset-list { display:block; }
.preset-list .grp-title { font-size:.72rem; color:#868e96; padding:8px 10px 4px; letter-spacing:.4px; }
.preset-item { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; padding:9px 10px; border-radius:8px; cursor:pointer; font-size:.83rem; transition:background .12s; }
.preset-item:hover { background:#f6f9fc; }
.preset-item.active { background:#e7f2fd; color:#1864ab; font-weight:600; }
.preset-item .pi-main { min-width:0; flex:1; }
.preset-item .pi-name { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.preset-item .pi-src { display:block; font-size:.7rem; color:#868e96; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
.preset-item.active .pi-src { color:#4A90E2; }
.preset-item .pi-badge { font-size:.66rem; background:#e9ecef; color:#868e96; border-radius:10px; padding:2px 7px; white-space:nowrap; flex-shrink:0; }
.preset-item.active .pi-badge { background:#4A90E2; color:#fff; }
.preset-item .pi-prog { display:block; font-size:.68rem; color:#37b24d; margin-top:2px; }
.preset-divider { height:1px; background:#eef2f7; margin:6px 4px; }
.preset-custom { padding:4px 6px 6px; }
.preset-custom input { width:100%; padding:7px 12px; border:1px solid #ced4da; border-radius:8px; font-size:.8rem; outline:none; box-sizing:border-box; }
.preset-custom input:focus { border-color:#4A90E2; }
.preset-custom .hint { font-size:.68rem; color:#adb5bd; margin-top:4px; }

.main-content { padding:14px; }
.filter-bar { display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center; }
.filter-btn { padding:5px 12px; border-radius:20px; border:none; background:#e9ecef; color:#495057; cursor:pointer; font-size:.82rem; transition:all .2s; }
.filter-btn.active { background:#4A90E2; color:#fff; }
.filter-btn:hover { transform:translateY(-1px); }
.search-box { flex:1; min-width:170px; padding:6px 14px; border:1px solid #ced4da; border-radius:20px; font-size:.82rem; outline:none; }
.search-box:focus { border-color:#4A90E2; }
.reset-btn { background:#f8d7da; color:#721c24; padding:5px 12px; border-radius:20px; border:none; font-size:.82rem; cursor:pointer; }
.score-filter { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:12px; padding:8px 12px; background:#f6f9fc; border-radius:10px; border:1px solid #eef2f7; }
.score-chip { padding:3px 11px; border-radius:16px; border:1px solid #dee2e6; background:#fff; font-size:.76rem; color:#495057; cursor:pointer; transition:all .15s; }
.score-chip:hover { border-color:#4A90E2; color:#4A90E2; }
.score-chip.active { background:#4A90E2; border-color:#4A90E2; color:#fff; }
.score-range { display:flex; align-items:center; gap:5px; margin-left:auto; }
.score-range input { width:70px; padding:4px 8px; border:1px solid #ced4da; border-radius:8px; font-size:.8rem; outline:none; }
.score-range span { font-size:.8rem; color:#868e96; }
.score-unknown { display:flex; align-items:center; gap:4px; font-size:.76rem; color:#495057; cursor:pointer; user-select:none; }
.score-unknown input { accent-color:#4A90E2; cursor:pointer; }
.chapter { background:#fff; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.05); margin-bottom:12px; overflow:hidden; scroll-margin-top:14px; }
.chapter-header { background:linear-gradient(90deg,#4A90E2 0%,#50E3C2 100%); color:#fff; padding:10px 16px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none; }
.chapter-header .arrow { transition:transform .25s; font-size:.8rem; margin-right:8px; display:inline-block; }
.chapter.open > .chapter-header .arrow { transform:rotate(90deg); }
.chapter-header:hover { filter:brightness(1.05); }
.chapter-title { font-size:1rem; font-weight:600; }
.chapter-count { background:rgba(255,255,255,.25); padding:2px 10px; border-radius:20px; font-size:.76rem; }
.chapter-body { display:none; padding:12px; }
.chapter.open > .chapter-body { display:block; }
.section { margin-top:10px; border:1px solid #eef2f7; border-radius:10px; overflow:hidden; scroll-margin-top:14px; }
.section:first-of-type { margin-top:0; }
.section-header { background:#f6f9fc; padding:9px 14px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; user-select:none; border-left:3px solid #4A90E2; }
.section-header:hover { background:#eef4fb; }
.section-header .arrow { transition:transform .25s; font-size:.75rem; margin-right:8px; color:#4A90E2; display:inline-block; }
.section.open > .section-header .arrow { transform:rotate(90deg); }
.section-title { font-size:.95rem; font-weight:600; color:#2c3e50; }
.section-count { font-size:.75rem; color:#868e96; background:#e9ecef; padding:2px 10px; border-radius:12px; }
.section-body { display:none; padding:10px 12px; }
.section.open > .section-body { display:block; }
.section-body .summary { margin-bottom:8px; }
.summary { padding:10px 14px; background:#f6f9fc; border-left:3px solid #50E3C2; border-radius:0 8px 8px 0; font-size:.83rem; color:#495057; line-height:1.7; overflow-wrap:break-word; }
.summary a { color:#1864ab; }
table { width:100%; border-collapse:collapse; }
tr { border-bottom:1px solid #f0f2f5; }
tr:last-child { border-bottom:none; }
tr:hover { background:#f8fbff; }
td { padding:6px 8px; font-size:.85rem; vertical-align:middle; }
.pid { color:#4A90E2; font-weight:600; white-space:nowrap; min-width:52px; }
.ptitle a { color:#2c3e50; text-decoration:none; }
.ptitle a:hover { color:#4A90E2; text-decoration:underline; }
.badge { display:inline-block; font-size:.68rem; padding:1px 6px; border-radius:10px; margin-left:5px; vertical-align:middle; }
.b-pre { background:#fff3cd; color:#856404; }
.b-score { background:#e8f4fd; color:#2980b9; }
.b-noscore { background:#f1f3f5; color:#adb5bd; }
.status-cells { white-space:nowrap; text-align:right; }
.status-btn { display:inline-block; padding:3px 9px; margin-left:4px; border-radius:12px; border:1px solid #dee2e6; background:#fff; font-size:.75rem; cursor:pointer; transition:all .15s; color:#868e96; }
.status-btn:hover { transform:translateY(-1px); }
.status-btn.s0.on { background:#adb5bd; border-color:#adb5bd; color:#fff; }
.status-btn.s1.on { background:#f59f00; border-color:#f59f00; color:#fff; }
.status-btn.s2.on { background:#37b24d; border-color:#37b24d; color:#fff; }
tr.st1 { background:#fff9ec; }
tr.st2 { background:#f2fbf4; }
.empty-tip { text-align:center; color:#adb5bd; font-size:.85rem; padding:40px 0; }
.toast { position:fixed; bottom:20px; right:20px; background:#333; color:#fff; padding:10px 18px; border-radius:8px; opacity:0; transform:translateY(60px); transition:all .3s; z-index:3000; font-size:.85rem; max-width:min(90vw,420px); line-height:1.4; }
.toast.show { opacity:1; transform:translateY(0); }
.toast.err { background:#c92a2a; }
.toast.ok  { background:#2b8a3e; }
.menu-toggle { display:none; position:fixed; left:14px; bottom:14px; z-index:1000; width:46px; height:46px; border-radius:50%; border:none; background:#4A90E2; color:#fff; font-size:1.2rem; cursor:pointer; box-shadow:0 4px 12px rgba(0,0,0,.25); }
.sidebar-mask { display:none; }
@media (max-width:900px){
  .layout { padding:8px; }
  .container{border-radius:10px}
  .main-content{padding:10px}
  .ptitle{min-width:0;overflow-wrap:anywhere}
  .pid{min-width:48px}
  .status-cells{white-space:normal;text-align:right}
  .status-btn{margin-bottom:3px}
  .sidebar { position:fixed; left:0; top:0; bottom:0; z-index:1001; border-radius:0; max-height:none; transform:translateX(-100%); transition:transform .3s; }
  .sidebar.show { transform:translateX(0); }
  .sidebar-mask.show { display:block; position:fixed; inset:0; background:rgba(0,0,0,.35); z-index:1000; }
  .menu-toggle { display:block; }
  td{padding:5px 4px;font-size:.78rem} .status-btn{padding:2px 6px;font-size:.7rem}
  .preset-btn .ptitle { max-width:90px; }
  h1 { font-size:.9rem; }
  .stat-item { padding:2px 7px; min-width:44px; }
  .stat-value { font-size:.8rem; }
  .stat-label { font-size:.58rem; }
}

.summary img{display:block;max-width:100%;height:auto;max-height:420px;object-fit:contain;margin:8px 0;border-radius:8px;background:#fff}
.summary pre{margin:8px 0;padding:12px 14px;background:#212529;color:#f8f9fa;border-radius:8px;overflow:auto;font:12px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
.summary code{padding:1px 5px;border-radius:4px;background:#eef2f7;color:#495057;font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.summary pre code{padding:0;background:transparent;color:inherit}
.summary h1,.summary h2,.summary h3,.summary h4,.summary h5,.summary h6{margin:10px 0 6px;color:#2c3e50;line-height:1.35}
.summary h1{font-size:1.15rem} .summary h2{font-size:1.05rem} .summary h3{font-size:.98rem} .summary h4{font-size:.92rem}
.summary p{margin:6px 0}
.summary ul,.summary ol{margin:6px 0 8px 22px}
.summary li{margin:3px 0}
.summary a{word-break:break-word}
.summary blockquote{margin:8px 0;padding:7px 12px;border-left:3px solid #50E3C2;background:#f6f9fc;color:#495057}
.summary hr{margin:10px 0;border:none;border-top:1px solid #eef2f7}
.summary table{width:auto;min-width:50%;max-width:100%;margin:8px 0;border-collapse:collapse;background:#fff;border:1px solid #e9ecef;border-radius:6px;overflow:hidden;font-size:.8rem;display:table}
.summary table th,.summary table td{border:1px solid #e9ecef;padding:6px 10px;text-align:left;vertical-align:top}
.summary table th{background:#f1f5f9;font-weight:600;color:#2c3e50;white-space:nowrap}
.summary table tr:nth-child(even) td{background:#fafbfc}
.summary table tr:hover td{background:#f8fbff}
@media (max-width:900px){
  .summary img{max-height:300px}
  .summary table{display:block;overflow-x:auto;white-space:nowrap}
}

.md-code{position:relative;margin:12px 0;border-radius:10px;overflow:auto;background:#0d1117;color:#e6edf3;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.md-code code{display:block;padding:16px 18px;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;font-size:13px;line-height:1.65;white-space:pre;tab-size:4}
.md-code .code-lang{position:absolute;right:10px;top:7px;font:11px/1.2 system-ui,sans-serif;color:#8b949e;letter-spacing:.04em;text-transform:lowercase;pointer-events:none}
.md-code code.hljs{padding:16px 18px;background:transparent}
.summary pre.md-code{white-space:normal}
</style>
</head>
<body>

<button class="menu-toggle" id="menuToggle">☰</button>
<div class="sidebar-mask" id="sidebarMask"></div>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <h3>📚 目录导航</h3>
    <div id="navList"></div>
  </aside>

  <div class="main">
    <div class="container">
      <header>
        <div class="header-row">
          <h1 id="pageTitle">🎯 算法题单刷题追踪器</h1>
          <div class="stats-bar">
            <div class="stat-item"><div class="stat-value" id="st-total">0</div><div class="stat-label">总题</div></div>
            <div class="stat-item"><div class="stat-value" id="st-done">0</div><div class="stat-label">已会</div></div>
            <div class="stat-item"><div class="stat-value" id="st-review">0</div><div class="stat-label">复习</div></div>
            <div class="stat-item"><div class="stat-value" id="st-todo">0</div><div class="stat-label">未开始</div></div>
            <div class="stat-item"><div class="stat-value" id="st-rate">0%</div><div class="stat-label">完成率</div></div>
          </div>

          <div class="preset-menu" id="presetMenu">
            <button class="preset-btn" id="presetBtn" aria-haspopup="listbox" aria-expanded="false">
              <span>📂</span>
              <span class="ptitle" id="presetCurrent">默认题单</span>
              <span class="caret">▼</span>
            </button>
            <div class="preset-list" id="presetList" role="listbox"></div>
          </div>
        </div>
      </header>
      <div class="main-content">

        <div class="filter-bar">
          <button class="filter-btn active" data-f="all">全部</button>
          <button class="filter-btn" data-f="0">未开始</button>
          <button class="filter-btn" data-f="1">需复习</button>
          <button class="filter-btn" data-f="2">已学会</button>
          <button class="filter-btn" data-f="pre">仅免费题</button>
          <input class="search-box" id="search" placeholder="🔍 搜索题号 / 题目名...">
          <button class="reset-btn" id="reset">清空进度</button>
        </div>

        <div class="score-filter">
          <span class="sf-label" style="font-size:.82rem;font-weight:600;color:#2c3e50">🎚 难度分：</span>
          <button class="score-chip active" data-min="0" data-max="99999">全部</button>
          <button class="score-chip" data-min="0" data-max="1400">&lt;1400</button>
          <button class="score-chip" data-min="1400" data-max="1700">1400-1700</button>
          <button class="score-chip" data-min="1700" data-max="2000">1700-2000</button>
          <button class="score-chip" data-min="2000" data-max="2300">2000-2300</button>
          <button class="score-chip" data-min="2300" data-max="99999">2300+</button>
          <div class="score-range">
            <input type="number" id="scoreMin" placeholder="最低" min="0">
            <span>~</span>
            <input type="number" id="scoreMax" placeholder="最高" min="0">
            <button class="score-chip" id="scoreApply">应用</button>
          </div>
          <label class="score-unknown"><input type="checkbox" id="includeUnknown" checked>含未知分(0)</label>
        </div>

        <div id="chapters"></div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" crossorigin="anonymous"></script>

<script>
// ====== 预设题单列表（url 支持绝对/相对路径）======

// ================= 通用工具 =================
function esc(s){
  return (s??'').toString()
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function safeUrl(u, fallback=''){
  try{
    const raw=String(u||'').trim();
    if(!raw) return fallback;
    const x=new URL(raw, location.href);
    if(['http:','https:','mailto:'].includes(x.protocol)) return x.href;
  }catch(e){}
  return fallback;
}

marked.setOptions({ gfm:true, breaks:true, headerIds:false, mangle:false, tables:true });
const renderer = new marked.Renderer();
renderer.code = function(code, infostring, escaped){
  const lang = (infostring||'').trim().split(/\s+/)[0].toLowerCase();
  const aliases = {py:'python',js:'javascript',ts:'typescript',cpp:'cpp',cxx:'cpp',rs:'rust',sh:'bash',shell:'bash'};
  const hlLang = aliases[lang]||lang;
  const cls = hlLang ? ` class="language-${esc(hlLang)}"` : '';
  const label = lang ? `<span class="code-lang">${esc(lang)}</span>` : '';
  const text = escaped ? code : esc(code);
  return `<pre class="md-code">${label}<code${cls}>${text}</code></pre>\n`;
};
marked.use({renderer});

const PURIFY_CONFIG = {
  ALLOWED_TAGS: ['a','b','strong','em','i','u','s','del','ul','ol','li','br','p','pre','code','img',
                 'h1','h2','h3','h4','h5','h6','blockquote','hr',
                 'table','thead','tbody','tfoot','tr','th','td','caption','colgroup','col','span','div'],
  ALLOWED_ATTR: ['href','target','rel','src','alt','title','class','colspan','rowspan','align','width','height','loading'],
  ALLOW_DATA_ATTR: false
};

function normSummary(s){
  if(!s) return '';
  const t = String(s).replace(/\r\n?/g,'\n').replace(/^\uFEFF/,'').trim();
  if(!t) return '';
  let html;
  if(/<(?:a|strong|b|em|ul|ol|li|br|pre|code|img|h[1-6]|blockquote|p|table|thead|tbody|tr|th|td)\b/i.test(t)){
    html = t;
  }else{
    html = marked.parse(t);
  }
  html = DOMPurify.sanitize(html, PURIFY_CONFIG);

  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('a[href]').forEach(a=>{
    const v = safeUrl(a.getAttribute('href'));
    if(!v){ a.removeAttribute('href'); return; }
    a.setAttribute('href', v);
    a.setAttribute('target','_blank');
    a.setAttribute('rel','noopener noreferrer');
  });
  doc.querySelectorAll('img[src]').forEach(img=>{
    const v = safeUrl(img.getAttribute('src'));
    if(!v){ img.removeAttribute('src'); return; }
    img.setAttribute('src', v);
    if(!img.getAttribute('loading')) img.setAttribute('loading','lazy');
  });
  doc.querySelectorAll('pre').forEach(pre=>pre.classList.add('md-code'));
  return doc.body.innerHTML;
}

// ================= 数据归一化 =================
function normProblem(p){
  if(Array.isArray(p)){
    const a=[...p];
    while(a.length<5) a.push(a.length===3?'':0);
    a[0]=(a[0]??'').toString();
    a[1]=(a[1]??a[0]).toString();
    a[2]=safeUrl(a[2]||'');
    a[3]=Number.isFinite(Number(a[3]))?Number(a[3]):0;
    a[4]=a[4]?1:0;
    return a.slice(0,5);
  }
  p=p&&typeof p==='object'?p:{};
  const id=(p.id??p.slug??'').toString();
  const title=(p.title??id).toString();
  const url=safeUrl(p.src||(p.slug?`https://leetcode.cn/problems/${p.slug}/`:''),'');
  return [id,title,url,Number.isFinite(Number(p.score))?Number(p.score):0,p.isPremium?1:0];
}
function normNode(node){
  if(Array.isArray(node)) node={title:'未命名',children:node};
  node=node&&typeof node==='object'?node:{};
  return {
    title:esc(node.title||'未命名'),
    src:safeUrl(node.src||'',''),
    summary:normSummary(node.summary),
    problems:Array.isArray(node.problems)?node.problems.map(normProblem).filter(p=>p[0]||p[1]):[],
    children:Array.isArray(node.children)?node.children.map(normNode):[]
  };
}
function normalizeData(raw){
  if(typeof raw==='string'){
    raw=raw.replace(/^\uFEFF/,'').trim();
    raw=JSON.parse(raw);
  }
  if(Array.isArray(raw)) raw={title:'我的题单',children:raw};
  if(!raw||typeof raw!=='object') throw new Error('JSON 顶层必须是对象或数组');
  if(raw.data&&typeof raw.data==='object'&&!raw.children&&!raw.problems) raw=raw.data;
  else if(raw.result&&typeof raw.result==='object'&&!raw.children&&!raw.problems) raw=raw.result;
  if(!Array.isArray(raw.children)&&!Array.isArray(raw.problems))
    throw new Error('数据中未找到 children 或 problems 字段');
  return normNode({
    title:raw.title||'我的题单',src:raw.src,summary:raw.summary,
    problems:raw.problems||[],children:raw.children||[]
  });
}

const LS_URL='quiz_tracker_url_v2';
const LS_PRESET='quiz_tracker_preset_v1';
let DATA=null, KEY='', st={};
let currentPresetKey = null;

function hashStr(s){
  let h=2166136261;
  for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); }
  return (h>>>0).toString(36);
}
function progressKey(presetKey, url, data){
  if(presetKey) return 'progress_preset_'+presetKey;
  if(url)       return 'progress_url_'+hashStr(url);
  return 'progress_data_'+hashStr(JSON.stringify(data));
}
function loadProgress(key){
  try{
    const raw = localStorage.getItem(key);
    if(raw) return JSON.parse(raw)||{};
    const cookie=document.cookie.split('; ').find(c=>c.startsWith(key+'='));
    if(cookie) return JSON.parse(decodeURIComponent(cookie.slice(key.length+1)))||{};
  }catch(e){}
  return {};
}
function boot(d, presetKey=null, url=null){
  DATA=d;
  currentPresetKey = presetKey;
  KEY = progressKey(presetKey, url, d);
  st = loadProgress(KEY);
  render();
}
function save(){
  const raw=JSON.stringify(st);
  try{ localStorage.setItem(KEY,raw); }
  catch(e){
    try{ document.cookie=KEY+'='+encodeURIComponent(raw)+'; expires=Thu, 31 Dec 2099 23:59:59 UTC; path=/; SameSite=Lax'; }catch(_){}
  }
}
const NAMES=['未开始','需复习','已学会'];

function getProgressSummary(presetKey, url){
  const key = progressKey(presetKey, url, null);
  if(!key) return null;
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return null;
    const obj = JSON.parse(raw)||{};
    let done=0, total=0;
    for(const k in obj){ total++; if(obj[k]===2) done++; }
    if(!total) return null;
    return { done, total };
  }catch(e){ return null; }
}

let filter='all', keyword='', scoreMin=0, scoreMax=99999, includeUnknown=true;
function resetFilterUI(){
  filter='all'; keyword=''; scoreMin=0; scoreMax=99999; includeUnknown=true;
  document.querySelectorAll('.filter-bar .filter-btn[data-f]').forEach(x=>x.classList.toggle('active',x.dataset.f==='all'));
  document.getElementById('search').value='';

  document.querySelectorAll('.score-chip').forEach(x=>x.classList.toggle('active',x.dataset.min==='0'&&x.dataset.max==='99999'));

function applyFilter(){
  let visible=0;
  cEl.querySelectorAll('tr[data-st]').forEach(tr=>{
    const s=+tr.dataset.st, score=+tr.dataset.score, pre=tr.dataset.pre==='1';
    let ok=true;
    if(filter==='0'||filter==='1'||filter==='2') ok=s===+filter;
    else if(filter==='pre') ok=!pre;
    if(ok){ ok=score===0?includeUnknown:(score>=scoreMin&&score<=scoreMax); }
    if(ok&&keyword) ok=tr.dataset.txt.includes(keyword);
    tr.style.display=ok?'':'none';
    if(ok) visible++;
  });
  const filtering=keyword||filter!=='all'||scoreMin>0||scoreMax<99999||!includeUnknown;
  cEl.querySelectorAll('.section').forEach(sec=>{
    const has=[...sec.querySelectorAll('tr[data-st]')].some(tr=>tr.style.display!=='none');
    sec.style.display=has?'':'none';
    if(has&&filtering) sec.classList.add('open');

    const has=[...ch.querySelectorAll('tr[data-st]')].some(tr=>tr.style.display!=='none');
    ch.style.display=has?'':'none';
    if(has&&filtering) ch.classList.add('open');

  if(!visible){
    if(!tip){ tip=document.createElement('div'); tip.className='empty-tip'; cEl.appendChild(tip); }

}

// ================= URL 加载（供菜单调用）=================
const LS_URL_KEY = LS_URL;

function isLoadableURL(s){
  if(!s) return false;
  if(/^https?:\/\//i.test(s)) return true;
  if(/^\/\//.test(s)) return true;
  if(/^\.\.?\//.test(s)) return true;
  if(/^\//.test(s)) return true;
  if(/^[a-zA-Z0-9._~%\-]+\//.test(s)) return true;
  if(/\.json(\?|#|$)/i.test(s)) return true;
  return false;
}
function resolveURL(u){
  const raw = String(u||'').trim();
  if(!raw) return '';
  try{
    const abs = new URL(raw, location.href).href;
    if(!/^https?:/i.test(abs)) return '';
    return abs;
  }catch(e){ return ''; }
}
function normalizeJsonUrl(url){
  let s = String(url||'').trim();
  if(!s) return s;
  try{
    const u = new URL(s, location.href);
    if(u.hostname==='github.com' && u.pathname.includes('/blob/')){
      const parts=u.pathname.split('/').filter(Boolean);
      if(parts.length>=4){
        const raw = `https://raw.githubusercontent.com/${parts[0]}/${parts[1]}/${parts.slice(3).join('/')}`;
        return raw + (u.search||'') + (u.hash||'');
      }
    }
    return u.href;
  }catch(e){ return s; }
}

async function loadData(raw, { presetKey=null, url=null } = {}){
  const d=normalizeData(raw);
  const cnt=countProblems(d);
  if(!cnt) throw new Error('数据中没有题目');
  resetFilterUI();
  boot(d, presetKey, url);
  showToast(`已加载「${d.title.replace(/&amp;/g,'&')}」（${cnt} 题）`,'ok');
  return true;
}

async function loadFromURL(url, { presetKey=null, silent=false } = {}){
  const rawInput = String(url||'').trim();
  if(!rawInput){
    if(!silent) showToast('请输入 JSON 地址（绝对或相对路径均可）','err');
    return false;
  }
  if(!isLoadableURL(rawInput)){
    if(!silent) showToast('地址格式无法识别，示例：./data/x.json、data/x.json、/api/x.json','err');
    return false;
  }
  let absUrl = resolveURL(rawInput);
  if(!absUrl){
    if(!silent) showToast('无法解析地址，请检查路径是否正确','err');
    return false;
  }
  absUrl = normalizeJsonUrl(absUrl);
  if(!/^https?:\/\//i.test(absUrl)){
    if(!silent) showToast('解析后的地址不是 http(s) 协议，无法加载','err');
    return false;
  }

  if(!silent) showToast('正在加载 '+rawInput+' …');
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),15000);
  try{
    const res=await fetch(absUrl,{cache:'no-store',signal:controller.signal,headers:{Accept:'application/json,text/plain,*/*'}});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const text=await res.text();
    if(!text.trim()) throw new Error('服务器返回空内容');
    let raw;
    try{ raw=JSON.parse(text.replace(/^\uFEFF/,'')); }
    catch(e){ throw new Error('返回内容不是合法 JSON'); }

    await loadData(raw, { presetKey, url: absUrl });

    if(presetKey){
      localStorage.setItem(LS_PRESET, presetKey);
      localStorage.removeItem(LS_URL_KEY);
    }else{
      localStorage.setItem(LS_URL_KEY, absUrl);
      localStorage.removeItem(LS_PRESET);
    }
    return true;
  }catch(e){
    let msg = e.message;
    if(e.name==='AbortError') msg = '请求超时（15 秒）';
    else if(/Failed to fetch|NetworkError/i.test(msg)){
      msg = '网络请求失败（404 / CORS / 协议不匹配）';
    }
    if(!silent) showToast('加载失败：'+msg,'err');
    return false;
  }finally{
    clearTimeout(timer);
  }
}

// ================= 右上角下拉菜单 =================
const presetMenu = document.getElementById('presetMenu');
const presetBtn  = document.getElementById('presetBtn');
const presetList = document.getElementById('presetList');
const presetCurrent = document.getElementById('presetCurrent');

function renderPresetList(){
  presetList.innerHTML = '';

  const grp = document.createElement('div');
  grp.className = 'grp-title';
  grp.textContent = '选择题单（进度按来源独立保存）';
  presetList.appendChild(grp);

  PRESETS.forEach(p=>{
    const item = document.createElement('div');
    item.className = 'preset-item' + (currentPresetKey===p.key ? ' active' : '');
    item.setAttribute('role','option');

    let prog = getProgressSummary(p.key, null);
    if(!prog && p.url){
      const abs = normalizeJsonUrl(resolveURL(p.url));
      if(abs) prog = getProgressSummary(null, abs);
    }
    const progText = prog ? `进度 ${prog.done}/${prog.total} 已学会` : '暂无进度';

    item.innerHTML = `
      <span class="pi-main">
        <span class="pi-name">${esc(p.name)}</span>
        <span class="pi-src">${esc(p.desc || p.url || '内置')}</span>
        <span class="pi-prog">${esc(progText)}</span>
      </span>
      <span class="pi-badge">${p.builtin ? '内置' : 'HTTP'}</span>
    `;
    item.onclick = ()=> selectPreset(p);
    presetList.appendChild(item);
  });

  const div = document.createElement('div');
  div.className = 'preset-divider';
  presetList.appendChild(div);

  const custom = document.createElement('div');
  custom.className = 'preset-custom';
  custom.innerHTML = `
    <input type="url" id="presetCustomUrl" placeholder="JSON 地址（相对/绝对），回车加载">
    <div class="hint">例如：./data/dp.json、data/graph.json、/api/list.json、https://host/x.json</div>
  `;
  presetList.appendChild(custom);

  const input = custom.querySelector('#presetCustomUrl');
  input.addEventListener('keydown', async e=>{
    if(e.key !== 'Enter') return;
    const v = e.target.value.trim();
    if(!v) return;
    closePresetMenu();
    await loadFromURL(v);
  });
}

async function selectPreset(p){
  closePresetMenu();
  if(p.builtin){
    resetFilterUI();
    boot(normalizeData(JSON.parse(JSON.stringify(DEFAULT_DATA))), p.key, null);
    showToast('已切换：'+p.name,'ok');
    localStorage.setItem(LS_PRESET, p.key);
    localStorage.removeItem(LS_URL_KEY);
    renderPresetList();
    updatePresetButton();
    return;
  }
  if(!p.url){
    showToast('该菜单项未配置 URL','err');
    return;
  }
  presetCurrent.textContent = '加载中…';
  await loadFromURL(p.url, { presetKey:p.key });
  updatePresetButton();
  renderPresetList();
}

function updatePresetButton(){
  let name = '默认题单';
  const p = PRESETS.find(x=>x.key===currentPresetKey);
  if(p) name = p.name;
  else if(currentPresetKey===null && localStorage.getItem(LS_URL_KEY)) name = '自定义 URL';
  presetCurrent.textContent = name;
}
function openPresetMenu(){ presetMenu.classList.add('open'); presetBtn.setAttribute('aria-expanded','true'); }
function closePresetMenu(){ presetMenu.classList.remove('open'); presetBtn.setAttribute('aria-expanded','false'); }
presetBtn.onclick = e=>{
  e.stopPropagation();
  presetMenu.classList.contains('open') ? closePresetMenu() : openPresetMenu();
};
document.addEventListener('click', e=>{
  if(!presetMenu.contains(e.target)) closePresetMenu();
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape') closePresetMenu();
});

// ================= 其他事件 =================
document.querySelectorAll('.filter-bar .filter-btn[data-f]').forEach(b=>{
  b.onclick=()=>{ document.querySelectorAll('.filter-bar .filter-btn[data-f]').forEach(x=>x.classList.remove('active')); b.classList.add('active'); filter=b.dataset.f; applyFilter(); };
});
document.getElementById('search').oninput=e=>{ keyword=e.target.value.trim().toLowerCase(); applyFilter(); };
document.getElementById('reset').onclick=()=>{
  if(!confirm('确定清空当前题单的标记进度吗？\n（只影响当前来源的进度，其他题单不受影响）')) return;
  st={}; save(); render(); showToast('当前题单进度已清空','ok');
};
document.querySelectorAll('.score-chip[data-min]').forEach(chip=>{
  chip.onclick=()=>{
    document.querySelectorAll('.score-chip').forEach(x=>x.classList.remove('active'));
    chip.classList.add('active');
    scoreMin=+chip.dataset.min; scoreMax=+chip.dataset.max;
    document.getElementById('scoreMin').value=scoreMin===0?'':scoreMin;
    document.getElementById('scoreMax').value=scoreMax===99999?'':scoreMax;
    applyFilter();
  };
});
document.getElementById('scoreApply').onclick=()=>{
  const min=document.getElementById('scoreMin').value, max=document.getElementById('scoreMax').value;
  scoreMin=min===''?0:+min; scoreMax=max===''?99999:+max;
  document.querySelectorAll('.score-chip').forEach(x=>x.classList.remove('active'));
  document.getElementById('scoreApply').classList.add('active');
  applyFilter();
};
document.getElementById('includeUnknown').onchange=e=>{ includeUnknown=e.target.checked; applyFilter(); };
const sidebar=document.getElementById('sidebar'), mask=document.getElementById('sidebarMask');
function closeSidebar(){ sidebar.classList.remove('show'); mask.classList.remove('show'); }
document.getElementById('menuToggle').onclick=()=>{ sidebar.classList.toggle('show'); mask.classList.toggle('show'); };
mask.onclick=closeSidebar;

// ================= 语法高亮 =================
function highlightMarkdownCode(){
  if(!window.hljs) return;
  document.querySelectorAll('#chapters pre code[class*="language-"]').forEach(el=>{
    if(el.dataset.highlighted) return;
    try { window.hljs.highlightElement(el); } catch(e) {}
  });
}
window.highlightMarkdownCode = highlightMarkdownCode;

(function(){
  const target=document.getElementById('chapters');
  if(!target) return;
  let queued=false;
  const obs=new MutationObserver(()=>{
    if(queued) return;
    queued=true;
    requestAnimationFrame(()=>{ queued=false; highlightMarkdownCode(); });
  });
  obs.observe(target,{childList:true,subtree:true});
})();

// ================= 启动 =================
(async function init(){
  renderPresetList();

  // 1) URL 参数优先
  const param=new URLSearchParams(location.search).get('json');
  if(param){
    if(await loadFromURL(param)) {
      currentPresetKey = null;
      updatePresetButton();
      renderPresetList();
      return;
    }
  }

  // 2) 上次选中的预设
  const savedPreset = localStorage.getItem(LS_PRESET);
  if(savedPreset){
    const p = PRESETS.find(x=>x.key===savedPreset);
    if(p){
      if(p.builtin){
        boot(normalizeData(JSON.parse(JSON.stringify(DEFAULT_DATA))), p.key, null);
        renderPresetList();
        return;
      }
      if(await loadFromURL(p.url, { presetKey:p.key, silent:true })) return;
    }
  }

  // 3) 上次的自定义 URL
  const savedUrl = localStorage.getItem(LS_URL_KEY);
  if(savedUrl){
    if(await loadFromURL(savedUrl, { silent:true })) {
      currentPresetKey = null;
      updatePresetButton();
      renderPresetList();
      return;
    }
  }

  // 4) 兜底：默认内置题单
  boot(normalizeData(JSON.parse(JSON.stringify(DEFAULT_DATA))), 'builtin-bitwise', null);
  renderPresetList();
  highlightMarkdownCode();
})();
</script>
