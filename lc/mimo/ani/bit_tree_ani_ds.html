<script type="text/plain" id="pySrc">
from math import gcd


def lowbit(x):
    """x 的二进制最低位 1 所对应的值"""
    return x & -x


def lcm(a, b):
    """最小公倍数"""
    if a == 0 or b == 0:
        return 0
    return abs(a // gcd(a, b) * b)


class BIT:
    """
    树状数组，支持多种区间聚合操作。

    可逆操作（sum, xor）：单点更新 O(log N)
    不可逆操作（max, min, gcd, lcm, or, and）：
        单点更新 O(log² N)

    下标约定：内部使用 1-based，arr[0] 占位不用。
    """

    # 各操作的单位元 ident：满足 merge(ident, x) == x
    IDENT = {
        'sum': 0, 'xor': 0,
        'max': float('-inf'), 'min': float('inf'),
        'gcd': 0, 'lcm': 1,
        'or':  0, 'and': -1,
    }

    # 有逆运算的操作，可以用增量更新
    REVERSIBLE = {'sum', 'xor'}

    def __init__(self, arr, op='sum'):
        self.n = len(arr) - 1
        self.op = op
        self.arr = arr[:]                        # arr[1..n]
        self.tree = [self.IDENT[op]] * (self.n + 1)
        for i in range(1, self.n + 1):
            self._recompute(i)

    # ---------- 聚合函数 ----------
    def _merge(self, a, b):
        """把两个值按 op 合并"""
        op = self.op
        if op == 'sum':  return a + b
        if op == 'xor':  return a ^ b
        if op == 'max':  return max(a, b)
        if op == 'min':  return min(a, b)
        if op == 'gcd':  return gcd(a, b)
        if op == 'lcm':  return lcm(a, b)
        if op == 'or':   return a | b
        if op == 'and':  return a & b
        raise ValueError(f'unknown op: {op}')

    # ---------- 单点更新 ----------
    def update(self, idx, val):
        """把 a[idx] 修改为 val"""
        old = self.arr[idx]
        self.arr[idx] = val

        if self.op in self.REVERSIBLE:
            self._update_reversible(idx, old, val)
        else:
            self._update_irreversible(idx)

    def _update_reversible(self, idx, old, val):
        """可逆操作：沿父链传播增量，O(log N)"""
        delta = val - old if self.op == 'sum' else (old ^ val)
        i = idx
        while i <= self.n:
            if self.op == 'sum':
                self.tree[i] += delta
            else:                                # xor
                self.tree[i] ^= delta
            i += lowbit(i)

    def _update_irreversible(self, idx):
        """不可逆操作：沿父链重算，O(log² N)"""
        i = idx
        while i <= self.n:
            self._recompute(i)
            i += lowbit(i)

    def _recompute(self, i):
        """
        重算 tree[i]。
        节点 i 覆盖 (i-lowbit(i), i]。
        把它拆成若干个更小的树节点 + 最后一个叶子。
        """
        lb = lowbit(i)
        lo = i - lb + 1
        acc = self.IDENT[self.op]
        j = i - 1
        while j >= lo:
            acc = self._merge(acc, self.tree[j])
            j -= lowbit(j)
        acc = self._merge(acc, self.arr[i])
        self.tree[i] = acc

    # ---------- 前缀查询 ----------
    def query(self, p):
        """查询 a[1..p] 的聚合值，O(log N)"""
        acc = self.IDENT[self.op]
        i = p
        while i >= 1:
            acc = self._merge(acc, self.tree[i])
            i -= lowbit(i)
        return acc


if __name__ == '__main__':
    arr = [None, 3, 1, 4, 1, 5, 9, 2, 6]

    for op in ['sum', 'max', 'min', 'gcd', 'lcm', 'or', 'and', 'xor']:
        bit = BIT(arr, op)
        print(f'{op:>4}[1..7] =', bit.query(7))

    # 更新演示
    bit = BIT(arr, 'sum')
    bit.update(1, 10)
    print('sum[1..7] after update =', bit.query(7))

    bit = BIT(arr, 'max')
    bit.update(2, 100)
    print('max[1..5] after update =', bit.query(5))

<script>
/* =========================================================
   1. 数据 & 聚合操作注册表
   ========================================================= */
const NS = 'http://www.w3.org/2000/svg';
const N  = 8;
const INIT_ARR = [null, 3, 1, 4, 1, 5, 9, 2, 6];

let arr  = INIT_ARR.slice();
let tree = new Array(N + 1).fill(null);
let busy = false;
let OP   = 'sum';

function _gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { [a, b] = [b, a % b]; }
  return a;
}

const OP_FN = {
  sum: (a, b) => a + b,
  max: (a, b) => Math.max(a, b),
  min: (a, b) => Math.min(a, b),
  gcd: (a, b) => _gcd(a, b),
  lcm: (a, b) => { if (a === 0 || b === 0) return 0; return Math.abs(a / _gcd(a, b) * b); },
  or:  (a, b) => a | b,
  and: (a, b) => a & b,
  xor: (a, b) => a ^ b,
};

const OP_IDENT = {
  sum: 0, max: -Infinity, min: Infinity, gcd: 0,
  lcm: 1, or: 0, and: -1, xor: 0,
};

const OP_SYM  = { sum:'sum', max:'max', min:'min', gcd:'gcd', lcm:'lcm', or:'or', and:'and', xor:'xor' };
const OP_NAME = {
  sum:'区间求和', max:'区间最大值', min:'区间最小值', gcd:'区间最大公约数',
  lcm:'区间最小公倍数', or:'区间按位或', and:'区间按位与', xor:'区间按位异或',
};
const OP_HINT = {
  sum: '加法有逆运算，更新时只需沿父链传增量 Δ = newVal − oldVal',
  xor: '异或自己是逆运算（a ⊕ a = 0），更新时只需沿父链传增量 Δ = oldVal ⊕ newVal',
  max: 'max 无逆运算，更新后必须沿父链重新计算每个节点的区间最值',
  min: 'min 无逆运算，更新后必须沿父链重新计算每个节点的区间最值',
  gcd: 'gcd 无逆运算，更新后必须沿父链重新计算每个节点的区间 gcd',
  lcm: 'lcm 无逆运算，更新后必须沿父链重新计算每个节点的区间 lcm',
  or:  '按位或无逆运算，更新后必须沿父链重新计算每个节点的区间或',
  and: '按位与无逆运算，更新后必须沿父链重新计算每个节点的区间与',
};

const REVERSIBLE = new Set(['sum', 'xor']);

const KNOWLEDGE = [
  { op:'sum', name:'求和',       sym:'sum', ident:'0',  rev:true,  desc:'加法有逆运算，更新时只需沿父链传增量 Δ = newVal − oldVal' },
  { op:'xor', name:'按位异或',   sym:'xor', ident:'0',  rev:true,  desc:'异或自己是逆运算（a ⊕ a = 0），更新时只需沿父链传增量 Δ = oldVal ⊕ newVal' },
  { op:'max', name:'最大值',     sym:'max', ident:'−∞', rev:false, desc:'max 无逆运算，更新后必须沿父链重新计算每个节点的区间最值' },
  { op:'min', name:'最小值',     sym:'min', ident:'+∞', rev:false, desc:'min 无逆运算，更新后必须沿父链重新计算每个节点的区间最值' },
  { op:'gcd', name:'最大公约数', sym:'gcd', ident:'0',  rev:false, desc:'gcd 无逆运算，更新后必须沿父链重新计算每个节点的区间 gcd' },
  { op:'lcm', name:'最小公倍数', sym:'lcm', ident:'1',  rev:false, desc:'lcm 无逆运算，更新后必须沿父链重新计算每个节点的区间 lcm' },
  { op:'or',  name:'按位或',     sym:'or',  ident:'0',  rev:false, desc:'按位或无逆运算，更新后必须沿父链重新计算每个节点的区间或' },
  { op:'and', name:'按位与',     sym:'and', ident:'−1', rev:false, desc:'按位与无逆运算，更新后必须沿父链重新计算每个节点的区间与' },
];

const lowbit   = i => i & -i;
const rangeOf  = i => { const lb = lowbit(i); return [i - lb + 1, i]; };
const parentOf = i => i + lowbit(i);
const sleep    = ms => new Promise(r => setTimeout(r, ms));

function reduceRange(l, r) {
  let acc = OP_IDENT[OP];
  for (let i = l; i <= r; i++) acc = OP_FN[OP](acc, arr[i]);
  return acc;
}
function computeDelta(oldVal, newVal) {
  if (OP === 'sum') return newVal - oldVal;
  if (OP === 'xor') return oldVal ^ newVal;
  return 0;
}
function applyDelta(cur, delta) {
  if (OP === 'sum') return cur + delta;
  if (OP === 'xor') return cur ^ delta;
  return cur;
}
function fmtDelta(delta) { return (delta >= 0 ? '+' : '') + delta; }

const RANGE  = {};
const PARENT = {};
for (let i = 1; i <= N; i++) {
  RANGE[i] = rangeOf(i);
  const p = parentOf(i);
  PARENT[i] = p <= N ? p : null;
}

/* =========================================================
   2. 布局
   ========================================================= */
const GRAY_W = 78, GRAY_H = 58, GAP = 10, LEFT = 65;
const grayLeft  = i => LEFT + (i - 1) * (GRAY_W + GAP);
const grayRight = i => grayLeft(i) + GRAY_W;
const grayCX    = i => grayLeft(i) + GRAY_W / 2;
const GRAY_Y = 545;

const LAYER_Y = [120, 225, 330, 435];
const NODE_H  = 50;

function depthOf(i) {
  let d = 0, cur = i;
  while (PARENT[cur] !== null) { d++; cur = PARENT[cur]; }
  return d;
}
let MAX_DEPTH = 0;
for (let i = 1; i <= N; i++) MAX_DEPTH = Math.max(MAX_DEPTH, depthOf(i));

const GREEN_POS = {};
for (let i = 1; i <= N; i++) {
  const [l, r] = RANGE[i];
  const left  = grayLeft(l);
  const width = grayRight(r) - left;
  const depth = depthOf(i);
  GREEN_POS[i] = { left, width, x: left + width / 2, y: LAYER_Y[depth], h: NODE_H, l, r, depth };
}
function rectOf(i)     { const g = GREEN_POS[i]; return { x: g.x, y: g.y, w: g.width, h: g.h }; }
function grayRectOf(i) { return { x: grayCX(i), y: GRAY_Y, w: GRAY_W, h: GRAY_H }; }

/* =========================================================
   3. SVG 工具
   ========================================================= */
const svg = document.getElementById('stage');
function mk(tag, attrs = {}, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function rectEdge(rect, tx, ty) {
  const dx = tx - rect.x, dy = ty - rect.y;
  const hw = rect.w / 2, hh = rect.h / 2;
  const sx = dx === 0 ? Infinity : hw / Math.abs(dx);
  const sy = dy === 0 ? Infinity : hh / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: rect.x + dx * s, y: rect.y + dy * s };
}

/* =========================================================
   4. 场景元素
   ========================================================= */
const greenRect = {}, greenValTxt = {}, greenIdxTxt = {}, greenRangeTxt = {};
const grayRect = [], grayIdxTxt = [], grayValTxt = [];
const edgeEls = {};
let dot, dotX = 0, dotY = 0;

function buildScene() {
  const defs = mk('defs', {}, svg);
  const marker = mk('marker', {
    id: 'ah', viewBox: '0 0 10 10',
    refX: '8', refY: '5', markerWidth: '6', markerHeight: '6', orient: 'auto'
  }, defs);
  mk('path', { d: 'M0,0 L10,5 L0,10 z', fill: '#93a1b0' }, marker);

  const edgeLayer = mk('g', {}, svg);
  const dotLayer  = mk('g', {}, svg);
  const nodeLayer = mk('g', {}, svg);

  for (let i = 1; i <= N; i++) {
    const p = PARENT[i];
    if (p === null) continue;
    const from = GREEN_POS[i], to = GREEN_POS[p];
    const a = rectEdge(from, to.x, to.y);
    let   b = rectEdge(to, from.x, from.y);
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    b.x -= dx / len * 4;
    b.y -= dy / len * 4;
    edgeEls[i] = mk('line', {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      class: 'edge', 'marker-end': 'url(#ah)'
    }, edgeLayer);
  }

  for (let i = 1; i <= N; i++) {
    const cx = grayCX(i);
    grayRect[i] = mk('rect', {
      x: cx - GRAY_W / 2, y: GRAY_Y - GRAY_H / 2,
      width: GRAY_W, height: GRAY_H, rx: 9, class: 'gray-node'
    }, nodeLayer);
    grayIdxTxt[i] = mk('text', {
      x: cx, y: GRAY_Y - GRAY_H / 2 - 14,
      class: 'gray-idx', 'text-anchor': 'middle', 'dominant-baseline': 'central'
    }, nodeLayer);
    grayIdxTxt[i].textContent = i;
    grayValTxt[i] = mk('text', {
      x: cx, y: GRAY_Y,
      class: 'gray-val', 'text-anchor': 'middle', 'dominant-baseline': 'central'
    }, nodeLayer);
    grayValTxt[i].textContent = arr[i];
  }

  for (let i = 1; i <= N; i++) {
    const g = GREEN_POS[i];
    greenRect[i] = mk('rect', {
      x: g.left, y: g.y - g.h / 2,
      width: g.width, height: g.h, rx: 8, class: 'green-node'
    }, nodeLayer);
    greenIdxTxt[i] = mk('text', {
      x: g.left + 10, y: g.y - g.h / 2 + 14,
      class: 'green-idx', 'text-anchor': 'start', 'dominant-baseline': 'central'
    }, nodeLayer);
    greenIdxTxt[i].textContent = i;
    greenRangeTxt[i] = mk('text', {
      x: g.left + g.width - 10, y: g.y - g.h / 2 + 14,
      class: 'green-range', 'text-anchor': 'end', 'dominant-baseline': 'central'
    }, nodeLayer);
    greenRangeTxt[i].textContent = `[${g.l},${g.r}]`;
    greenValTxt[i] = mk('text', {
      x: g.x, y: g.y + 2,
      class: 'green-val', 'text-anchor': 'middle', 'dominant-baseline': 'central'
    }, nodeLayer);
    greenValTxt[i].textContent = '–';
  }

  dot = mk('circle', { r: 9, cx: -100, cy: -100, opacity: 0, class: 'path-dot' }, dotLayer);
}

/* =========================================================
   5. 工具
   ========================================================= */
const resultEl = document.getElementById('result');
const setResult = t => { resultEl.textContent = t; };

function pop(el) {
  el.animate(
    [{ transform: 'scale(1)' }, { transform: 'scale(1.14)' }, { transform: 'scale(1)' }],
    { duration: 420, easing: 'ease-out' }
  );
}

function clearHighlights() {
  for (let i = 1; i <= N; i++) {
    greenRect[i].classList.remove('hl-update', 'hl-query');
    grayRect[i].classList.remove('hl-range', 'hl-cell');
  }
  for (const k in edgeEls) edgeEls[k].classList.remove('hl');
}

function resetTree() {
  tree = new Array(N + 1).fill(null);
  for (let i = 1; i <= N; i++) {
    greenValTxt[i].textContent = '–';
    greenRect[i].setAttribute('class', 'green-node');
    grayValTxt[i].textContent = arr[i];
    grayRect[i].setAttribute('class', 'gray-node');
  }
  for (const k in edgeEls) edgeEls[k].setAttribute('class', 'edge');
}
function resetState() { arr = INIT_ARR.slice(); resetTree(); }

/* =========================================================
   6. 知识模块渲染
   ========================================================= */
function renderKnowledge() {
  const grid = document.getElementById('kGrid');
  grid.innerHTML = '';
  KNOWLEDGE.forEach(k => {
    const card = document.createElement('div');
    card.className = 'k-card' + (k.op === OP ? ' active' : '');
    card.dataset.op = k.op;
    card.innerHTML = `
      <div class="k-head">
        <span class="k-name">${k.name}</span>
        <span class="k-sym">${k.sym}</span>
        <span class="k-tag ${k.rev ? 'rev' : 'irrev'}">${k.rev ? '可逆 · 增量' : '不可逆 · 重算'}</span>
      </div>
      <div class="k-meta">
        单位元 <code>${k.ident}</code> · 更新方式 ${k.rev ? '沿父链 Δ 传播' : '沿父链重算区间'}
      </div>
      <div class="k-desc">${k.desc}</div>
    `;
    card.addEventListener('click', () => {
      if (busy || k.op === OP) return;
      OP = k.op;
      opSel.value = OP;
      updateSubtitle();
      updateKnowledgeActive();
      resetTree();
      runBuild();
    });
    grid.appendChild(card);
  });
}
function updateKnowledgeActive() {
  document.querySelectorAll('.k-card').forEach(card => {
    card.classList.toggle('active', card.dataset.op === OP);
  });
}

/* =========================================================
   7. 小圆点
   ========================================================= */
function setDotPos(x, y) { dotX = x; dotY = y; dot.setAttribute('cx', x); dot.setAttribute('cy', y); }
function showDotAt(x, y) { setDotPos(x, y); dot.setAttribute('opacity', 1); }
function hideDot() { dot.setAttribute('opacity', 0); }

function moveDotTo(x, y, duration = 600) {
  return new Promise(resolve => {
    const sx = dotX, sy = dotY;
    const t0 = performance.now();
    function step(now) {
      const t = Math.min(1, (now - t0) / duration);
      const e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
      setDotPos(sx + (x - sx) * e, sy + (y - sy) * e);
      if (t < 1) requestAnimationFrame(step); else resolve();
    }
    requestAnimationFrame(step);
  });
}
async function hopBetween(fromRect, toRect, duration = 620) {
  const a = rectEdge(fromRect, toRect.x, toRect.y);
  const b = rectEdge(toRect, fromRect.x, fromRect.y);
  await moveDotTo(a.x, a.y, 140);
  await moveDotTo(b.x, b.y, duration);
}

/* =========================================================
   8. 副标题
   ========================================================= */
function updateSubtitle() {
  const rev = REVERSIBLE.has(OP);
  const tag = rev
    ? '<span class="tag rev">可逆 · 增量更新</span>'
    : '<span class="tag irrev">不可逆 · 重算更新</span>';
  document.getElementById('subtitle').innerHTML =
    `下标从 <b>1</b> 开始 · 节点 <code>i</code> 覆盖区间 <code>(i−lowbit(i), i]</code> · ` +
    `父节点 <code>i + lowbit(i)</code> · 当前：<b>${OP_NAME[OP]}</b>${tag}`;
}

/* =========================================================
   9. 构建
   ========================================================= */
async function runBuild() {
  if (busy) return;
  busy = true;
  hideDot();
  updateSubtitle();
  updateKnowledgeActive();
  setResult(`构建中：每个绿色节点 = 它管辖区间内元素的 ${OP_NAME[OP]}`);
  await sleep(450);

  for (let i = 1; i <= N; i++) {
    const [l, r] = RANGE[i];
    for (let j = l; j <= r; j++) grayRect[j].classList.add('hl-range');
    setResult(`tree[${i}]：管辖区间 [${l}, ${r}]，正在计算 ${OP_SYM[OP]}(a[${l}..${r}])…`);
    await sleep(360);

    tree[i] = reduceRange(l, r);
    greenValTxt[i].textContent = tree[i];
    pop(greenRect[i]);
    setResult(`tree[${i}] = ${OP_SYM[OP]}(a[${l}..${r}]) = ${tree[i]}`);
    await sleep(320);

    for (let j = l; j <= r; j++) grayRect[j].classList.remove('hl-range');
    await sleep(60);
  }

  setResult(`构建完成：节点 8 覆盖整个数组，存放 ${OP_NAME[OP]} 的总结果`);
  busy = false;
}

/* =========================================================
   10. 单点更新
   ========================================================= */
async function runUpdate(idx, newVal) {
  if (busy) return;
  if (tree[1] === null) { setResult('请先点击「重新构建」'); return; }

  busy = true;
  clearHighlights();

  const oldVal = arr[idx];
  const delta  = computeDelta(oldVal, newVal);
  arr[idx] = newVal;

  grayValTxt[idx].textContent = newVal;
  grayRect[idx].classList.add('hl-cell');
  pop(grayRect[idx]);
  if (REVERSIBLE.has(OP)) {
    setResult(`a[${idx}]：${oldVal} → ${newVal}　Δ = ${fmtDelta(delta)}　（${OP_HINT[OP]}）`);
  } else {
    setResult(`a[${idx}]：${oldVal} → ${newVal}　（${OP_HINT[OP]}）`);
  }
  await sleep(820);

  const gR = grayRectOf(idx);
  const tR = rectOf(idx);
  const startPt = rectEdge(gR, tR.x, tR.y);
  showDotAt(startPt.x, startPt.y);
  await sleep(200);
  await hopBetween(gR, tR, 600);

  let i = idx;
  while (i <= N) {
    const [l, r] = RANGE[i];

    if (REVERSIBLE.has(OP)) {
      tree[i] = applyDelta(tree[i], delta);
      greenValTxt[i].textContent = tree[i];
      greenRect[i].classList.add('hl-update');
      pop(greenRect[i]);
      setResult(`tree[${i}] ${OP === 'xor' ? '⊕' : '+'}= ${fmtDelta(delta)} → ${tree[i]}`);
      await sleep(620);
    } else {
      for (let j = l; j <= r; j++) grayRect[j].classList.add('hl-range');
      tree[i] = reduceRange(l, r);
      greenValTxt[i].textContent = tree[i];
      greenRect[i].classList.add('hl-update');
      pop(greenRect[i]);
      setResult(`tree[${i}] = ${OP_SYM[OP]}(a[${l}..${r}]) = ${tree[i]}`);
      await sleep(680);
      for (let j = l; j <= r; j++) grayRect[j].classList.remove('hl-range');
    }

    if (PARENT[i] !== null) {
      edgeEls[i].classList.add('hl');
      await hopBetween(rectOf(i), rectOf(PARENT[i]), 640);
    }
    i = parentOf(i);
  }

  setResult(`更新完成：点沿 i + lowbit(i) 上行，所有受影响节点已同步（${REVERSIBLE.has(OP) ? '增量' : '重算'}）`);
  await sleep(700);
  hideDot();
  await sleep(700);
  clearHighlights();
  busy = false;
}

/* =========================================================
   11. 前缀查询
   ========================================================= */
async function runQuery(p) {
  if (busy) return;
  if (tree[1] === null) { setResult('请先点击「重新构建」'); return; }

  busy = true;
  clearHighlights();

  const gR = grayRectOf(p);
  const firstR = rectOf(p);
  const startPt = rectEdge(gR, firstR.x, firstR.y);
  showDotAt(startPt.x, startPt.y);
  setResult(`查询 ${OP_SYM[OP]}[1..${p}]：i 从 ${p} 开始，每次 i -= lowbit(i)`);
  await sleep(620);

  let acc = OP_IDENT[OP];
  let i = p;
  let prevR = gR;

  while (i >= 1) {
    const curR = rectOf(i);
    await hopBetween(prevR, curR, 620);

    const [l, r] = RANGE[i];
    for (let j = l; j <= r; j++) grayRect[j].classList.add('hl-range');
    greenRect[i].classList.add('hl-query');
    pop(greenRect[i]);

    acc = OP_FN[OP](acc, tree[i]);
    setResult(`${OP_SYM[OP]}(累计值, tree[${i}] = ${tree[i]}) → 当前结果 = ${acc}`);
    await sleep(760);

    prevR = curR;
    i -= lowbit(i);
  }

  setResult(`✔ ${OP_SYM[OP]}[1..${p}] = ${acc}`);
  await sleep(800);
  hideDot();
  await sleep(900);
  clearHighlights();
  busy = false;
}

/* =========================================================
   12. Python 代码高亮
   ========================================================= */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function highlightPython(code) {
  const KEYWORDS = new Set([
    'def','class','return','if','elif','else','for','while','in','not','and','or',
    'is','None','True','False','raise','from','import','as','try','except','finally',
    'with','lambda','yield','global','nonlocal','pass','break','continue'
  ]);
  const BUILTINS = new Set([
    'print','max','min','abs','gcd','lcm','len','range','float','int','str',
    'list','dict','set','tuple','sum','isinstance','ValueError'
  ]);

  let html = '';
  let i = 0;
  while (i < code.length) {
    const c = code[i];

    /* 注释 */
    if (c === '#') {
      let j = i;
      while (j < code.length && code[j] !== '\n') j++;
      html += '<span class="tok-comment">' + escapeHtml(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }

    /* 三引号 docstring */
    if (code.slice(i, i + 3) === '"""' || code.slice(i, i + 3) === "'''") {
      const q = code.slice(i, i + 3);
      let j = i + 3;
      while (j < code.length && code.slice(j, j + 3) !== q) j++;
      j += 3;
      html += '<span class="tok-string">' + escapeHtml(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }

    /* 单/双引号字符串 */
    if (c === '"' || c === "'") {
      const q = c;
      let j = i + 1;
      while (j < code.length && code[j] !== q) {
        if (code[j] === '\\') j++;
        j++;
      }
      j++;
      html += '<span class="tok-string">' + escapeHtml(code.slice(i, j)) + '</span>';
      i = j;
      continue;
    }

    /* 标识符 / 关键字 */
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < code.length && /[A-Za-z0-9_]/.test(code[j])) j++;
      const word = code.slice(i, j);

      if (word === 'self') {
        html += '<span class="tok-self">self</span>';
      } else if (KEYWORDS.has(word)) {
        html += '<span class="tok-keyword">' + word + '</span>';
      } else if (BUILTINS.has(word)) {
        html += '<span class="tok-builtin">' + word + '</span>';
      } else if (code[j] === '(') {
        html += '<span class="tok-func">' + word + '</span>';
      } else {
        html += word;
      }
      i = j;
      continue;
    }

    /* 数字 */
    if (/\d/.test(c)) {
      let j = i;
      while (j < code.length && /[\d.]/.test(code[j])) j++;
      html += '<span class="tok-number">' + code.slice(i, j) + '</span>';
      i = j;
      continue;
    }

    /* 其他字符 */
    html += escapeHtml(c);
    i++;
  }
  return html;
}

function renderPythonCode() {
  const src = document.getElementById('pySrc').textContent.trim();
  document.getElementById('pyCode').innerHTML = highlightPython(src);
}

/* =========================================================
   13. 初始化 & 事件
   ========================================================= */
buildScene();
renderKnowledge();
renderPythonCode();

const selUpd = document.getElementById('updIdx');
const selQry = document.getElementById('qryIdx');
const opSel  = document.getElementById('opSel');
for (let i = 1; i <= N; i++) {
  selUpd.appendChild(new Option(i, i));
  selQry.appendChild(new Option(i, i));
}
selUpd.value = 1;
selQry.value = 7;

opSel.addEventListener('change', () => {
  if (busy) { opSel.value = OP; return; }
  OP = opSel.value;
  updateSubtitle();
  updateKnowledgeActive();
  resetTree();
  runBuild();
});

document.getElementById('btnBuild').addEventListener('click', () => {
  if (busy) return;
  resetState();
  runBuild();
});
document.getElementById('btnUpdate').addEventListener('click', () => {
  runUpdate(+selUpd.value, +document.getElementById('updVal').value);
});
document.getElementById('btnQuery').addEventListener('click', () => {
  runQuery(+selQry.value);
});

setTimeout(() => { updateSubtitle(); updateKnowledgeActive(); resetState(); runBuild(); }, 500);
</script>
