<!-- ============ 普通线段树源码 ============ -->
<script type="text/plain" id="pySrc">
from math import gcd


def lcm(a, b):
    """最小公倍数"""
    if a == 0 or b == 0:
        return 0
    return abs(a // gcd(a, b) * b)


class SegmentTree:
    """
    递归线段树，支持多种区间聚合操作。

    每个节点 p 维护一段区间 [l, r] 的聚合值：
        tree[p] = merge(tree[2p], tree[2p+1])

    复杂度：
        单点更新  O(log N)
        区间查询  O(log N)

    数组使用 1-based，arr[0] 占位不用。
    """

    IDENT = {
        'sum': 0, 'xor': 0,
        'max': float('-inf'), 'min': float('inf'),
        'gcd': 0, 'lcm': 1,
        'or':  0, 'and': -1,
    }

    def __init__(self, arr, op='sum'):
        self.n = len(arr) - 1
        self.op = op
        self.arr = arr[:]
        self.tree = [self.IDENT[op]] * (4 * self.n + 5)
        self._build(1, 1, self.n)

    def _merge(self, a, b):
        op = self.op
        if op == 'sum': return a + b
        if op == 'xor': return a ^ b
        if op == 'max': return max(a, b)
        if op == 'min': return min(a, b)
        if op == 'gcd': return gcd(a, b)
        if op == 'lcm': return lcm(a, b)
        if op == 'or':  return a | b
        if op == 'and': return a & b
        raise ValueError(f'unknown op: {op}')

    def _build(self, p, l, r):
        if l == r:
            self.tree[p] = self.arr[l]
            return
        mid = (l + r) // 2
        self._build(2 * p, l, mid)
        self._build(2 * p + 1, mid + 1, r)
        self.tree[p] = self._merge(self.tree[2 * p], self.tree[2 * p + 1])

    def update(self, idx, val):
        """把 a[idx] 修改为 val，O(log N)"""
        self.arr[idx] = val
        self._update(1, 1, self.n, idx, val)

    def _update(self, p, l, r, idx, val):
        if l == r:
            self.tree[p] = val
            return
        mid = (l + r) // 2
        if idx <= mid:
            self._update(2 * p, l, mid, idx, val)
        else:
            self._update(2 * p + 1, mid + 1, r, idx, val)
        self.tree[p] = self._merge(self.tree[2 * p], self.tree[2 * p + 1])

    def query(self, ql, qr):
        """查询 a[ql..qr] 的聚合值，O(log N)"""
        return self._query(1, 1, self.n, ql, qr)

    def _query(self, p, l, r, ql, qr):
        if ql <= l and r <= qr:
            return self.tree[p]
        mid = (l + r) // 2
        if qr <= mid:
            return self._query(2 * p, l, mid, ql, qr)
        if ql > mid:
            return self._query(2 * p + 1, mid + 1, r, ql, qr)
        left  = self._query(2 * p, l, mid, ql, qr)
        right = self._query(2 * p + 1, mid + 1, r, ql, qr)
        return self._merge(left, right)


if __name__ == '__main__':
    arr = [None, 3, 1, 4, 1, 5, 9, 2, 6]

    for op in ['sum', 'max', 'min', 'gcd', 'lcm', 'or', 'and', 'xor']:
        st = SegmentTree(arr, op)
        print(f'{op:>4}[2..6] =', st.query(2, 6))

    st = SegmentTree(arr, 'sum')
    st.update(3, 100)
    print('sum[1..8] after update =', st.query(1, 8))
</script>

<!-- ============ 懒标记线段树源码 ============ -->
<script type="text/plain" id="pyLazySrc">
class LazySegmentTree:
    """
    懒标记线段树：支持「区间加」与「区间求和」。

    与普通线段树的区别：
        1. 区间更新时，若节点区间被完全覆盖，直接打上 lazy 标记并返回；
           不再递归到叶子，把 O(N) 降到 O(log N)。
        2. 任何时刻访问该节点的孩子之前，先把它的 lazy 下传（push_down）。

    推广到其他操作时，需要按语义调整 3 个函数：
        merge(tree, l, r)      父节点值 = 合并左右孩子
        apply(p, l, r, val)    把标记应用到节点 p
        compose(lazy, val)     旧标记与新标记合并
    """

    def __init__(self, arr):
        self.n = len(arr) - 1
        self.tree = [0] * (4 * self.n + 5)
        self.lazy = [0] * (4 * self.n + 5)
        self._build(1, 1, self.n, arr)

    def _build(self, p, l, r, arr):
        if l == r:
            self.tree[p] = arr[l]
            return
        mid = (l + r) // 2
        self._build(2 * p, l, mid, arr)
        self._build(2 * p + 1, mid + 1, r, arr)
        self.tree[p] = self.tree[2 * p] + self.tree[2 * p + 1]

    def _apply(self, p, l, r, val):
        """
        把标记 val 应用到节点 p：
            - 该节点的聚合值按 val 更新
            - 该节点的 lazy 标记累加
        """
        self.tree[p] += val * (r - l + 1)
        self.lazy[p] += val

    def _push_down(self, p, l, r):
        """把节点 p 的 lazy 标记下传给左右孩子"""
        if self.lazy[p] == 0 or l == r:
            return
        mid = (l + r) // 2
        self._apply(2 * p, l, mid, self.lazy[p])
        self._apply(2 * p + 1, mid + 1, r, self.lazy[p])
        self.lazy[p] = 0

    def update(self, ql, qr, val):
        """a[ql..qr] 全部加上 val，O(log N)"""
        self._update(1, 1, self.n, ql, qr, val)

    def _update(self, p, l, r, ql, qr, val):
        if ql <= l and r <= qr:
            self._apply(p, l, r, val)
            return
        self._push_down(p, l, r)
        mid = (l + r) // 2
        if ql <= mid:
            self._update(2 * p, l, mid, ql, qr, val)
        if qr > mid:
            self._update(2 * p + 1, mid + 1, r, ql, qr, val)
        self.tree[p] = self.tree[2 * p] + self.tree[2 * p + 1]

    def query(self, ql, qr):
        """查询 a[ql..qr] 的和，O(log N)"""
        return self._query(1, 1, self.n, ql, qr)

    def _query(self, p, l, r, ql, qr):
        if ql <= l and r <= qr:
            return self.tree[p]
        self._push_down(p, l, r)
        mid = (l + r) // 2
        res = 0
        if ql <= mid:
            res += self._query(2 * p, l, mid, ql, qr)
        if qr > mid:
            res += self._query(2 * p + 1, mid + 1, r, ql, qr)
        return res


if __name__ == '__main__':
    arr = [None, 3, 1, 4, 1, 5, 9, 2, 6]
    lst = LazySegmentTree(arr)
    print('sum[1..8] =', lst.query(1, 8))

    lst.update(3, 6, 10)
    print('sum[3..6] =', lst.query(3, 6))
    print('sum[1..8] =', lst.query(1, 8))
    print('sum[2..5] =', lst.query(2, 5))
</script>

<script>
/* =========================================================
   1. 数据 & 聚合操作
   ========================================================= */
const NS = 'http://www.w3.org/2000/svg';
const N  = 8;
const INIT_ARR = [null, 3, 1, 4, 1, 5, 9, 2, 6];

let arr  = INIT_ARR.slice();
let tree = new Array(4 * N + 5).fill(null);
let busy = false;
let OP   = 'sum';

function _gcd(a, b) {
  a = Math.abs(a); b = Math.abs(b);
  while (b) { [a, b] = [b, a % b]; }
  return a;
}

const OP_FN = {
  sum: (a, b) => a + b,
  max: (a, b) => Math.max(a, b),
  min: (a, b) => Math.min(a, b),
  gcd: (a, b) => _gcd(a, b),
  lcm: (a, b) => { if (a === 0 || b === 0) return 0; return Math.abs(a / _gcd(a, b) * b); },
  or:  (a, b) => a | b,
  and: (a, b) => a & b,
  xor: (a, b) => a ^ b,
};
const OP_IDENT = {
  sum: 0, max: -Infinity, min: Infinity, gcd: 0,
  lcm: 1, or: 0, and: -1, xor: 0,
};
const OP_SYM  = { sum:'sum', max:'max', min:'min', gcd:'gcd', lcm:'lcm', or:'or', and:'and', xor:'xor' };
const OP_NAME = {
  sum:'区间求和', max:'区间最大值', min:'区间最小值', gcd:'区间最大公约数',
  lcm:'区间最小公倍数', or:'区间按位或', and:'区间按位与', xor:'区间按位异或',
};

/* =========================================================
   2. 树的定义
   ========================================================= */
const NODES = {
  1:  { l:1, r:8, depth:0 },
  2:  { l:1, r:4, depth:1 }, 3:  { l:5, r:8, depth:1 },
  4:  { l:1, r:2, depth:2 }, 5:  { l:3, r:4, depth:2 },
  6:  { l:5, r:6, depth:2 }, 7:  { l:7, r:8, depth:2 },
  8:  { l:1, r:1, depth:3 }, 9:  { l:2, r:2, depth:3 },
  10: { l:3, r:3, depth:3 }, 11: { l:4, r:4, depth:3 },
  12: { l:5, r:5, depth:3 }, 13: { l:6, r:6, depth:3 },
  14: { l:7, r:7, depth:3 }, 15: { l:8, r:8, depth:3 },
};
const leafOf = i => i + 7;
const parentOf = p => Math.floor(p / 2);

const sleep = ms => new Promise(r => setTimeout(r, ms));

/* =========================================================
   3. 布局
   ========================================================= */
const GRAY_W = 76, GRAY_H = 56, GAP = 12, LEFT = 62;
const grayLeft  = i => LEFT + (i - 1) * (GRAY_W + GAP);
const grayRight = i => grayLeft(i) + GRAY_W;
const grayCX    = i => grayLeft(i) + GRAY_W / 2;
const GRAY_Y = 560;

const LAYER_Y = [92, 206, 320, 434];
const NODE_H = 56;

const G_POS = {};
for (const p in NODES) {
  const { l, r, depth } = NODES[p];
  const left = grayLeft(l);
  const right = grayRight(r);
  G_POS[p] = {
    left, width: right - left,
    cx: (left + right) / 2,
    cy: LAYER_Y[depth],
    l, r,
  };
}

/* 关键：转成 rectEdge 需要的 {x, y, w, h} 结构 */
function rectOf(p) {
  const g = G_POS[p];
  return { x: g.cx, y: g.cy, w: g.width, h: NODE_H };
}
function grayRectOf(i) {
  return { x: grayCX(i), y: GRAY_Y, w: GRAY_W, h: GRAY_H };
}

/* =========================================================
   4. SVG 工具
   ========================================================= */
const svg = document.getElementById('stage');
function mk(tag, attrs = {}, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) el.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(el);
  return el;
}
function rectEdge(rect, tx, ty) {
  const dx = tx - rect.x, dy = ty - rect.y;
  const hw = rect.w / 2, hh = rect.h / 2;
  const sx = dx === 0 ? Infinity : hw / Math.abs(dx);
  const sy = dy === 0 ? Infinity : hh / Math.abs(dy);
  const s = Math.min(sx, sy);
  return { x: rect.x + dx * s, y: rect.y + dy * s };
}

/* =========================================================
   5. 场景元素
   ========================================================= */
const greenRect = {}, greenValTxt = {}, greenIdxTxt = {}, greenRangeTxt = {}, greenIdxBadge = {};
const grayRect = [], grayIdxTxt = [], grayValTxt = [];
const edgeEls = {};

function buildScene() {
  const defs = mk('defs', {}, svg);

  /* 三种颜色的箭头 marker */
  function makeMarker(id, color) {
    const m = mk('marker', {
      id, viewBox: '0 0 10 10',
      refX: '9', refY: '5',
      markerWidth: '7', markerHeight: '7',
      orient: 'auto'
    }, defs);
    mk('path', { d: 'M0,0 L10,5 L0,10 z', fill: color }, m);
    return m;
  }
  makeMarker('ah-gray',   '#b4bec9');
  makeMarker('ah-orange', '#e09b00');
  makeMarker('ah-blue',   '#2a86d0');

  const edgeLayer = mk('g', {}, svg);
  const nodeLayer = mk('g', {}, svg);

  /* ---- 树边：用 rectOf 拿到正确的 {x,y,w,h} ---- */
  for (let p = 2; p <= 15; p++) {
    const par = parentOf(p);
    const from = rectOf(p);
    const to   = rectOf(par);

    const a = rectEdge(from, to.x, to.y);
    let   b = rectEdge(to, from.x, from.y);

    /* 终点向节点内缩一点，避免箭头压在边框上 */
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy) || 1;
    b.x -= dx / len * 5;
    b.y -= dy / len * 5;

    edgeEls[p] = mk('line', {
      x1: a.x, y1: a.y, x2: b.x, y2: b.y,
      class: 'edge'
    }, edgeLayer);
  }

  /* ---- 灰色方块 ---- */
  for (let i = 1; i <= N; i++) {
    const cx = grayCX(i);
    grayRect[i] = mk('rect', {
      x: cx - GRAY_W / 2, y: GRAY_Y - GRAY_H / 2,
      width: GRAY_W, height: GRAY_H, rx: 9, class: 'gray-node'
    }, nodeLayer);
    grayIdxTxt[i] = mk('text', {
      x: cx, y: GRAY_Y - GRAY_H / 2 - 14,
      class: 'gray-idx', 'text-anchor': 'middle', 'dominant-baseline': 'central'
    }, nodeLayer);
    grayIdxTxt[i].textContent = i;
    grayValTxt[i] = mk('text', {
      x: cx, y: GRAY_Y,
      class: 'gray-val', 'text-anchor': 'middle', 'dominant-baseline': 'central'
    }, nodeLayer);
    grayValTxt[i].textContent = arr[i];
  }

  /* ---- 绿色节点：按层从根到叶画，避免遮挡 ---- */
  const order = Object.keys(NODES).map(Number).sort((a, b) => NODES[a].depth - NODES[b].depth);
  for (const p of order) {
    const g = G_POS[p];

    greenRect[p] = mk('rect', {
      x: g.left, y: g.cy - NODE_H / 2,
      width: g.width, height: NODE_H, rx: 8, class: 'green-node'
    }, nodeLayer);

    /* 左上角：编号徽章 */
    greenIdxBadge[p] = mk('rect', {
      x: g.left + 6, y: g.cy - NODE_H / 2 + 6,
      width: 26, height: 16, rx: 5,
      class: 'idx-badge'
    }, nodeLayer);
    greenIdxTxt[p] = mk('text', {
      x: g.left + 19, y: g.cy - NODE_H / 2 + 14,
      class: 'green-idx', 'text-anchor': 'middle', 'dominant-baseline': 'central'
    }, nodeLayer);
    greenIdxTxt[p].textContent = p;

    /* 右上角：区间 */
    greenRangeTxt[p] = mk('text', {
      x: g.left + g.width - 8, y: g.cy - NODE_H / 2 + 14,
      class: 'green-range', 'text-anchor': 'end', 'dominant-baseline': 'central'
    }, nodeLayer);
    greenRangeTxt[p].textContent = `[${g.l},${g.r}]`;

    /* 中间：值 */
    greenValTxt[p] = mk('text', {
      x: g.cx, y: g.cy + 8,
      class: 'green-val', 'text-anchor': 'middle', 'dominant-baseline': 'central'
    }, nodeLayer);
    greenValTxt[p].textContent = '–';
  }
}

/* =========================================================
   6. 工具
   ========================================================= */
const resultEl = document.getElementById('result');
const setResult = t => { resultEl.textContent = t; };

function pop(el) {
  el.animate(
    [{ transform: 'scale(1)' }, { transform: 'scale(1.12)' }, { transform: 'scale(1)' }],
    { duration: 400, easing: 'ease-out' }
  );
}
function clearHighlights() {
  for (let p = 1; p <= 15; p++) {
    greenRect[p].classList.remove('hl-update', 'hl-query', 'hl-hit', 'hl-leaf');
  }
  for (let i = 1; i <= N; i++) {
    grayRect[i].classList.remove('hl-cell');
  }
  for (const k in edgeEls) edgeEls[k].classList.remove('hl', 'qhit');
}
function resetTree() {
  tree = new Array(4 * N + 5).fill(null);
  for (let p = 1; p <= 15; p++) {
    greenValTxt[p].textContent = '–';
    greenRect[p].setAttribute('class', 'green-node');
  }
  for (let i = 1; i <= N; i++) {
    grayValTxt[i].textContent = arr[i];
    grayRect[i].setAttribute('class', 'gray-node');
  }
  for (const k in edgeEls) edgeEls[k].setAttribute('class', 'edge');
}
function resetState() { arr = INIT_ARR.slice(); resetTree(); }

/* =========================================================
   7. 副标题
   ========================================================= */
function updateSubtitle() {
  document.getElementById('subtitle').innerHTML =
    `下标从 <b>1</b> 开始 · 根节点 [1, ${N}] 代表整个数组 · 每个内部节点 = 左右孩子合并 · 当前操作：<b>${OP_NAME[OP]}</b>`;
}

/* =========================================================
   8. 构建
   ========================================================= */
async function runBuild() {
  if (busy) return;
  busy = true;
  clearHighlights();
  setResult(`构建中：从叶子向上，每个内部节点 = 左右孩子的 ${OP_NAME[OP]}`);
  await sleep(450);

  /* 先把叶子显示出来 */
  for (let i = 1; i <= N; i++) {
    const p = leafOf(i);
    tree[p] = arr[i];
    greenValTxt[p].textContent = arr[i];
    greenRect[p].classList.add('hl-leaf');
    await sleep(70);
    greenRect[p].classList.remove('hl-leaf');
  }

  /* 逐层合并，先点亮边再合并 */
  const layers = [[4, 5, 6, 7], [2, 3], [1]];
  for (const layer of layers) {
    for (const p of layer) {
      const L = 2 * p, R = 2 * p + 1;

      /* 两条边亮起（蓝绿色流动虚线） */
      edgeEls[L].classList.add('qhit');
      edgeEls[R].classList.add('qhit');
      greenRect[L].classList.add('hl-query');
      greenRect[R].classList.add('hl-query');
      setResult(`节点 ${p}（区间 [${G_POS[p].l}, ${G_POS[p].r}]）：合并孩子 ${L} 与 ${R}`);
      await sleep(400);

      /* 计算父节点 */
      tree[p] = OP_FN[OP](tree[L], tree[R]);
      greenValTxt[p].textContent = tree[p];
      greenRect[L].classList.remove('hl-query');
      greenRect[R].classList.remove('hl-query');
      edgeEls[L].classList.remove('qhit');
      edgeEls[R].classList.remove('qhit');

      greenRect[p].classList.add('hl-update');
      pop(greenRect[p]);
      setResult(`tree[${p}] = ${OP_SYM[OP]}(${tree[L]}, ${tree[R]}) = ${tree[p]}`);
      await sleep(430);
      greenRect[p].classList.remove('hl-update');
    }
  }

  setResult(`构建完成：根节点 tree[1] = ${OP_SYM[OP]}[1..${N}] = ${tree[1]}`);
  busy = false;
}

/* =========================================================
   9. 单点更新：叶子 → 根，沿虚线逐条点亮
   ========================================================= */
async function runUpdate(idx, newVal) {
  if (busy) return;
  if (tree[1] === null) { setResult('请先点击「重新构建」'); return; }

  busy = true;
  clearHighlights();

  const oldVal = arr[idx];
  arr[idx] = newVal;
  const leaf = leafOf(idx);

  /* 灰块变化 */
  grayValTxt[idx].textContent = newVal;
  grayRect[idx].classList.add('hl-cell');
  pop(grayRect[idx]);
  setResult(`a[${idx}]：${oldVal} → ${newVal}　（更新路径沿虚线自底向上）`);
  await sleep(720);

  /* 更新叶子 */
  tree[leaf] = newVal;
  greenValTxt[leaf].textContent = newVal;
  greenRect[leaf].classList.add('hl-update');
  pop(greenRect[leaf]);
  setResult(`叶子节点 ${leaf}（区间 [${idx}, ${idx}]）= ${newVal}`);
  await sleep(600);

  /* 沿虚线向上 */
  let p = leaf;
  while (p > 1) {
    const par = parentOf(p);
    const L = 2 * par, R = 2 * par + 1;

    /* 点亮这条虚线边（橙色流动虚线） */
    edgeEls[p].classList.add('hl');
    setResult(`虚线路径：节点 ${p} → 父节点 ${par}，正在合并 ${L} 与 ${R}`);
    await sleep(520);

    /* 高亮两个孩子 */
    greenRect[L].classList.add('hl-query');
    greenRect[R].classList.add('hl-query');
    if (L !== p) edgeEls[L].classList.add('hl');
    if (R !== p) edgeEls[R].classList.add('hl');
    await sleep(240);

    /* 计算父节点 */
    tree[par] = OP_FN[OP](tree[L], tree[R]);
    greenValTxt[par].textContent = tree[par];
    greenRect[L].classList.remove('hl-query');
    greenRect[R].classList.remove('hl-query');
    if (L !== p) edgeEls[L].classList.remove('hl');
    if (R !== p) edgeEls[R].classList.remove('hl');
    greenRect[par].classList.add('hl-update');
    pop(greenRect[par]);
    setResult(`tree[${par}] = ${OP_SYM[OP]}(${tree[L]}, ${tree[R]}) = ${tree[par]}`);
    await sleep(480);

    p = par;
  }

  setResult(`更新完成：从叶子到根，路径上的节点已重新合并`);
  await sleep(700);
  await sleep(700);
  clearHighlights();
  busy = false;
}

/* =========================================================
   10. 区间查询
   ========================================================= */
function collectQuery(p, ql, qr, out, visit) {
  const { l, r } = NODES[p];
  const hit = (ql <= l && r <= qr);
  visit.push({ p, hit });
  if (hit) { out.push({ p }); return; }
  const mid = (l + r) >> 1;
  if (ql <= mid) collectQuery(2 * p, ql, qr, out, visit);
  if (qr > mid)  collectQuery(2 * p + 1, ql, qr, out, visit);
}

async function runQuery(ql, qr) {
  if (busy) return;
  if (tree[1] === null) { setResult('请先点击「重新构建」'); return; }

  busy = true;
  clearHighlights();

  const hits = [], visit = [];
  collectQuery(1, ql, qr, hits, visit);

  setResult(`查询 ${OP_SYM[OP]}[${ql}..${qr}]：从根出发，命中 ${hits.length} 个完全覆盖的节点`);
  await sleep(560);

  /* 高亮从根到命中节点的所有虚线边（蓝色流动虚线） */
  const visitSet = new Set(visit.map(v => v.p));
  for (const v of visit) {
    if (v.p === 1) continue;
    const par = parentOf(v.p);
    if (visitSet.has(par) && !v.hit) {
      edgeEls[v.p].classList.add('qhit');
    }
  }
  await sleep(680);

  let acc = OP_IDENT[OP];
  for (let k = 0; k < hits.length; k++) {
    const { p } = hits[k];
    greenRect[p].classList.add('hl-hit');
    pop(greenRect[p]);

    const before = acc;
    acc = OP_FN[OP](acc, tree[p]);
    const isFirst = (k === 0);
    setResult(`命中节点 ${p}（区间 [${G_POS[p].l}, ${G_POS[p].r}] = ${tree[p]}）　→　${OP_SYM[OP]}(${isFirst ? '空' : before}, ${tree[p]}) = ${acc}`);
    await sleep(820);
  }

  setResult(`✔ ${OP_SYM[OP]}[${ql}..${qr}] = ${acc}`);
  await sleep(900);
  await sleep(700);
  clearHighlights();
  busy = false;
}

/* =========================================================
   12. Python 代码高亮
   ========================================================= */
function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}
function highlightPython(code) {
  const KEYWORDS = new Set([
    'def','class','return','if','elif','else','for','while','in','not','and','or',
    'is','None','True','False','raise','from','import','as','try','except','finally',
    'with','lambda','yield','global','nonlocal','pass','break','continue'
  ]);
  const BUILTINS = new Set([
    'print','max','min','abs','gcd','lcm','len','range','float','int','str',
    'list','dict','set','tuple','sum','isinstance','ValueError'
  ]);
  let html = '', i = 0;
  while (i < code.length) {
    const c = code[i];
    if (c === '#') {
      let j = i; while (j < code.length && code[j] !== '\n') j++;
      html += '<span class="tok-comment">' + escapeHtml(code.slice(i, j)) + '</span>';
      i = j; continue;
    }
    if (code.slice(i, i + 3) === '"""' || code.slice(i, i + 3) === "'''") {
      const q = code.slice(i, i + 3);
      let j = i + 3;
      while (j < code.length && code.slice(j, j + 3) !== q) j++;
      j += 3;
      html += '<span class="tok-string">' + escapeHtml(code.slice(i, j)) + '</span>';
      i = j; continue;
    }
    if (c === '"' || c === "'") {
      const q = c; let j = i + 1;
      while (j < code.length && code[j] !== q) { if (code[j] === '\\') j++; j++; }
      j++;
      html += '<span class="tok-string">' + escapeHtml(code.slice(i, j)) + '</span>';
      i = j; continue;
    }
    if (/[A-Za-z_]/.test(c)) {
      let j = i;
      while (j < code.length && /[A-Za-z0-9_]/.test(code[j])) j++;
      const word = code.slice(i, j);
      if (word === 'self') html += '<span class="tok-self">self</span>';
      else if (KEYWORDS.has(word)) html += '<span class="tok-keyword">' + word + '</span>';
      else if (BUILTINS.has(word)) html += '<span class="tok-builtin">' + word + '</span>';
      else if (code[j] === '(') html += '<span class="tok-func">' + word + '</span>';
      else html += word;
      i = j; continue;
    }
    if (/\d/.test(c)) {
      let j = i; while (j < code.length && /[\d.]/.test(code[j])) j++;
      html += '<span class="tok-number">' + code.slice(i, j) + '</span>';
      i = j; continue;
    }
    html += escapeHtml(c);
    i++;
  }
  return html;
}
function renderPythonCode() {
  document.getElementById('pyCode').innerHTML =
    highlightPython(document.getElementById('pySrc').textContent.trim());
  document.getElementById('pyLazyCode').innerHTML =
    highlightPython(document.getElementById('pyLazySrc').textContent.trim());
}
