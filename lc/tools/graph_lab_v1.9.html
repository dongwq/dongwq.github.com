<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图 · 算法演算台</title>
    <style>
        :root {
            --bg: #faf5ec;
            --panel: #f3ecdf;
            --well: #ece3d2;
            --line: #d8ccb4;
            --edge: #c2b295;
            --ink: #2b2117;
            --dim: #6b5945;
            --faint: #9c8a6e;
            --acid: #a86e00;
            --ember: #d95f2b;
            --rose: #c9683c;
            --serif: Georgia, 'Times New Roman', 'Songti SC', 'SimSun', serif;
            --sans: system-ui, -apple-system, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            --mono: ui-monospace, 'Cascadia Mono', 'SF Mono', Consolas, 'Courier New', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box
        }

        html,
        body {
            height: 100%
        }

        body {
            background: var(--panel);
            color: var(--ink);
            font-family: var(--sans);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            background-image: radial-gradient(ellipse 80% 60% at 70% -10%, #fdf9f1 0%, transparent 60%);
        }

        header {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 12px 20px;
            border-bottom: 1px solid var(--line);
            flex: none;
            background: var(--bg);
        }

        .brand {
            display: flex;
            align-items: baseline;
            gap: 14px
        }

        .brand h1 {
            font-family: var(--serif);
            font-weight: 900;
            font-size: 21px;
            letter-spacing: .5px;
        }

        .brand h1 em {
            color: var(--acid);
            font-style: normal
        }

        .brand .sub {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--dim)
        }

        .toggles {
            margin-left: auto;
            display: flex;
            gap: 10px
        }

        .tg {
            display: flex;
            border: 1px solid var(--edge);
            border-radius: 3px;
            overflow: hidden;
            background: var(--bg)
        }

        .tg button {
            background: transparent;
            border: none;
            color: var(--dim);
            cursor: pointer;
            font: 12px/1 var(--sans);
            padding: 7px 13px;
            transition: .18s;
            font-family: inherit;
        }

        .tg button.on {
            background: var(--ink);
            color: #fdf6ec;
            font-weight: 700
        }

        .tg button:not(.on):hover {
            color: var(--ink)
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr 300px;
            min-height: 0
        }

        .col {
            border-right: 1px solid var(--line);
            overflow-y: auto;
            min-height: 0;
            background: var(--panel)
        }

        .col:last-child {
            border-right: none
        }

        .col::-webkit-scrollbar {
            width: 7px
        }

        .col::-webkit-scrollbar-thumb {
            background: var(--edge);
            border-radius: 4px
        }

        .sec {
            padding: 12px 14px;
            border-bottom: 1px solid var(--line)
        }

        .sec h2 {
            font-family: var(--mono);
            font-size: 1.15em;
            letter-spacing: 1.5px;
            color: var(--dim);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .sec h2 i {
            color: var(--acid);
            font-style: normal;
            margin-right: 5px;
            font-size: 1.15em;
        }

        textarea {
            width: 100%;
            height: 12em;
            background: var(--well);
            border: 1px solid var(--edge);
            border-radius: 4px;
            color: var(--ink);
            font-family: var(--mono);
            font-size: 12px;
            line-height: 1.7;
            padding: 8px 10px;
            resize: vertical;
            outline: none;
        }

        textarea:focus {
            border-color: var(--acid);
            box-shadow: 0 0 0 2px rgba(168, 110, 0, .12)
        }

        textarea::placeholder {
            color: #a89677
        }

        .hint {
            font-size: 10px;
            color: var(--dim);
            margin-top: 6px;
            line-height: 1.6;
            font-family: var(--mono)
        }

        .hint b {
            color: var(--acid);
            font-weight: 600
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            background: transparent;
            border: 1px solid #9c8a6e;
            color: var(--ink);
            font: 500 12px var(--sans);
            padding: 7px 12px;
            border-radius: 3px;
            cursor: pointer;
            transition: .16s;
            font-family: inherit;
        }

        .btn:hover {
            border-color: var(--acid);
            color: var(--acid)
        }

        .btn.primary {
            background: var(--ink);
            border-color: var(--ink);
            color: #fdf6ec;
            font-weight: 700
        }

        .btn.primary:hover {
            background: #43361f;
            border-color: #43361f;
            color: #fff
        }

        .btn:disabled {
            opacity: .4;
            cursor: not-allowed
        }

        .btnrow {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap
        }

        .presets {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px
        }

        .chip {
            border: 1px solid var(--edge);
            background: var(--bg);
            color: var(--dim);
            font: 11px var(--sans);
            padding: 3px 9px;
            border-radius: 20px;
            cursor: pointer;
            transition: .15s;
            font-family: inherit;
            white-space: nowrap;
        }

        .chip:hover {
            color: var(--acid);
            border-color: var(--acid)
        }

        .chip.topo {
            border-radius: 20px;
            padding: 3px 10px;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .chip.topo b {
            font: 600 11px var(--sans);
            color: var(--ink)
        }

        .chip.topo small {
            font: 9px var(--mono);
            color: var(--faint)
        }

        .chip.topo:hover {
            border-color: var(--acid)
        }

        .chip.topo:hover b {
            color: var(--acid)
        }

        .adj {
            font-family: var(--mono);
            font-size: 10px;
            line-height: 1.95;
            color: var(--dim)
        }

        .adj b {
            color: var(--ink);
            font-weight: 600;
            margin-right: 3px
        }

        .adj .w {
            color: var(--ember)
        }

        table.matrix {
            border-collapse: collapse;
            font-family: var(--mono);
            font-size: 9px;
            margin-top: 4px
        }

        table.matrix td,
        table.matrix th {
            border: 1px solid var(--line);
            width: 21px;
            height: 19px;
            text-align: center;
            color: var(--dim);
        }

        table.matrix th {
            color: var(--acid);
            font-weight: 600
        }

        table.matrix td.on {
            color: var(--ink);
            background: var(--well)
        }

        .stage {
            position: relative;
            overflow: hidden;
            min-height: 0;
            display: flex;
            flex-direction: column
        }

        #cv {
            flex: 1;
            cursor: grab;
            touch-action: none
        }

        .tools {
            position: absolute;
            top: 12px;
            left: 12px;
            display: flex;
            gap: 5px;
            background: rgba(250, 245, 236, .94);
            border: 1px solid var(--edge);
            padding: 5px;
            border-radius: 5px;
            backdrop-filter: blur(6px);
            z-index: 2;
        }

        .tool {
            width: 34px;
            height: 34px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            border-radius: 4px;
            cursor: pointer;
            color: var(--dim);
            transition: .15s;
        }

        .tool:hover {
            color: var(--ink)
        }

        .tool.on {
            background: var(--ink);
            color: #fdf6ec
        }

        .tool svg {
            width: 17px;
            height: 17px
        }

        .toolbar-bottom {
            position: absolute;
            bottom: 12px;
            left: 12px;
            z-index: 2;
            display: flex;
            gap: 8px;
            align-items: center
        }

        .legend {
            display: flex;
            gap: 12px;
            background: rgba(250, 245, 236, .92);
            border: 1px solid var(--edge);
            padding: 6px 12px;
            border-radius: 5px;
            font-size: 10px;
            color: var(--dim);
            backdrop-filter: blur(6px);
        }

        .legend s {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 4px;
            vertical-align: -1px;
            text-decoration: none
        }

        .legend .l-idle {
            border: 1.5px solid #8a7660;
            background: #fff
        }

        .legend .l-fr {
            background: var(--ember)
        }

        .legend .l-done {
            background: var(--acid)
        }

        .legend .l-path {
            background: transparent;
            border: 1.5px solid var(--acid);
            border-radius: 0;
            width: 11px;
            height: 0
        }

        #wbox {
            position: absolute;
            display: none;
            transform: translate(-50%, -50%);
            background: #fff;
            border: 1px solid var(--acid);
            border-radius: 4px;
            padding: 4px;
            box-shadow: 0 4px 14px rgba(60, 45, 25, .18);
            z-index: 5;
        }

        #wbox input {
            width: 60px;
            background: none;
            border: none;
            outline: none;
            color: var(--acid);
            font: 600 14px var(--mono);
            text-align: center;
        }

        .toast {
            position: absolute;
            top: 14px;
            left: 50%;
            transform: translateX(-50%) translateY(-8px);
            background: #fff;
            border: 1px solid var(--ember);
            color: var(--ember);
            font: 12px var(--mono);
            padding: 7px 14px;
            border-radius: 4px;
            opacity: 0;
            transition: .25s;
            pointer-events: none;
            box-shadow: 0 4px 14px rgba(60, 45, 25, .14);
            z-index: 6;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0)
        }

        .algo-list {
            display: flex;
            flex-direction: column;
            gap: 5px
        }

        .algo {
            text-align: left;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--dim);
            padding: 8px 11px;
            border-radius: 4px;
            cursor: pointer;
            transition: .16s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: inherit;
        }

        .algo b {
            font: 600 12px var(--sans);
            color: var(--ink);
            display: block
        }

        .algo small {
            font: 9px var(--mono);
            opacity: .85
        }

        .algo:hover {
            border-color: #a89677
        }

        .algo.on {
            border-color: var(--acid);
            background: rgba(168, 110, 0, .08)
        }

        .algo.on b {
            color: var(--acid)
        }

        .exgroup {
            margin-bottom: 7px
        }

        .exgroup .gt {
            font: 600 9px var(--mono);
            color: var(--acid);
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 5px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .exgroup .gt::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--line)
        }

        .exrow {
            display: flex;
            flex-wrap: wrap;
            gap: 5px
        }

        .exchip {
            border: 1px solid var(--edge);
            background: var(--bg);
            color: var(--dim);
            padding: 3px 10px;
            border-radius: 20px;
            cursor: pointer;
            transition: .15s;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        .exchip b {
            font: 600 11px var(--sans);
            color: var(--ink)
        }

        .exchip small {
            font: 9px var(--mono);
            color: var(--faint)
        }

        .exchip:hover {
            border-color: var(--acid);
            box-shadow: 0 2px 6px rgba(60, 45, 25, .12)
        }

        .exchip:hover b {
            color: var(--acid)
        }

        .autorun {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
            font: 10px var(--sans);
            color: var(--dim);
            cursor: pointer;
            user-select: none;
        }

        .autorun input {
            accent-color: var(--acid);
            cursor: pointer
        }

        .note {
            background: var(--well);
            border: 1px solid var(--line);
            border-left: 3px solid var(--acid);
            border-radius: 4px;
            padding: 6px 9px;
            font-size: 10px;
            color: var(--dim);
            line-height: 1.7;
            margin-top: 8px;
            display: none;
        }

        .note b {
            color: var(--acid)
        }

        .note.show {
            display: block;
            animation: fadein .3s
        }

        select {
            width: 100%;
            background: var(--well);
            border: 1px solid var(--edge);
            color: var(--ink);
            font: 12px var(--sans);
            padding: 7px 9px;
            border-radius: 3px;
            outline: none;
        }

        select:focus {
            border-color: var(--acid)
        }

        .field {
            margin-bottom: 9px
        }

        .field label {
            font-size: 10px;
            color: var(--dim);
            display: block;
            margin-bottom: 4px;
            font-family: var(--mono)
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 5px
        }

        .controls .btn {
            padding: 8px 0
        }

        .speed {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 9px
        }

        .speed input[type=range] {
            flex: 1;
            -webkit-appearance: none;
            height: 2px;
            background: var(--edge);
            outline: none;
            border-radius: 2px;
        }

        .speed input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--acid);
            cursor: pointer;
        }

        .speed span {
            font: 10px var(--mono);
            color: var(--dim);
            min-width: 34px;
            text-align: right
        }

        .stat {
            background: var(--well);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 8px 10px;
            font: 10px var(--mono);
            color: var(--dim);
            min-height: 36px;
            line-height: 1.8;
        }

        .stat b {
            color: var(--acid);
            font-weight: 600
        }

        .stat .q {
            color: var(--ember)
        }

        #log {
            font: 10px/1.8 var(--mono);
            color: var(--dim);
            max-height: 160px;
            overflow-y: auto
        }

        #log::-webkit-scrollbar {
            width: 6px
        }

        #log::-webkit-scrollbar-thumb {
            background: var(--edge)
        }

        #log p {
            padding: 2px 0;
            border-bottom: 1px dashed #ddd1b8;
            animation: fadein .3s
        }

        #log p b {
            color: var(--acid);
            font-weight: 600;
            margin-right: 7px
        }

        #log p.hl {
            color: var(--ink)
        }

        @keyframes fadein {
            from {
                opacity: 0;
                transform: translateY(3px)
            }

            to {
                opacity: 1
            }
        }

        .empty {
            color: #a89677;
            font-style: italic
        }

        footer {
            flex: none;
            border-top: 1px solid var(--line);
            padding: 6px 20px;
            font: 10px var(--mono);
            color: var(--faint);
            display: flex;
            justify-content: space-between;
            background: var(--bg);
        }

        /* 伪代码 */
        .prereq {
            font: 10px/1.65 var(--sans);
            color: var(--dim);
            background: var(--well);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 7px 9px;
            margin-bottom: 8px;
        }

        .prereq b {
            color: var(--acid)
        }

        .pseudo {
            font: 11px/1.55 var(--mono);
            background: var(--bg);
            border: 1px solid var(--line);
            border-radius: 4px;
            padding: 6px 0;
            max-height: 200px;
            overflow-y: auto;
        }

        .pseudo .pl {
            padding: 3px 10px 3px 8px;
            border-left: 3px solid transparent;
            color: var(--dim);
            white-space: pre-wrap;
            word-break: break-all;
        }

        .pseudo .pl.on {
            background: rgba(168, 110, 0, .12);
            border-left-color: var(--acid);
            color: var(--ink);
            font-weight: 600;
        }

        .pseudo .pl .ln {
            color: var(--faint);
            margin-right: 6px;
            font-size: 9px
        }
    </style>
</head>

<body>

    <header>
        <div class="brand">
            <h1>图 · <em>算法演算台</em></h1>
            <span class="sub">GRAPH / ALGORITHM / LAB — v1.9</span>
        </div>
        <div class="toggles">
            <div class="tg" id="tgDir">
                <button data-v="0" class="on">无向图</button>
                <button data-v="1">有向图</button>
            </div>
            <div class="tg" id="tgW">
                <button data-v="0" class="on">无权重</button>
                <button data-v="1">带权重</button>
            </div>
        </div>
    </header>

    <main>
        <div class="col">
            <div class="sec">
                <h2><i>01</i>边关系输入</h2>
                <textarea id="edges" spellcheck="false"
                    placeholder="每行一条边：起点 终点 权重&#10;例如：A B 4&#10;权重可省略（默认 1）&#10;支持空格 / 逗号 / - / -> 分隔"></textarea>
                <div class="hint">格式：<b>A B 4</b> 或 <b>A,B,4</b> · 忽略空行 · 点击边可改权</div>
                <div class="btnrow">
                    <button class="btn primary" id="btnBuild">生成图形</button>
                    <button class="btn" id="btnLayout">整理布局</button>
                </div>
                <div class="presets">
                    <button class="chip" data-p="classic">经典教材图</button>
                    <button class="chip" data-p="grid">网格图</button>
                    <button class="chip" data-p="dense">稠密随机图</button>
                </div>
            </div>
            <div class="sec">
                <h2><i>02</i>典型图结构</h2>
                <div class="presets" id="topoList"></div>
            </div>
            <div class="sec">
                <h2><i>03</i>邻接表</h2>
                <div class="adj" id="adj">—</div>
            </div>
            <div class="sec">
                <h2><i>04</i>邻接矩阵</h2>
                <div id="matrix">—</div>
            </div>
        </div>

        <div class="col stage" id="stage">
            <canvas id="cv"></canvas>
            <div class="tools" id="tools">
                <button class="tool on" data-t="select" title="选择 / 拖拽 / 点边改权">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 3l7 17 2.5-7.5L21 10z" />
                    </svg>
                </button>
                <button class="tool" data-t="node" title="添加节点（点击空白处）">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="7" />
                        <path d="M12 9v6M9 12h6" />
                    </svg>
                </button>
                <button class="tool" data-t="edge" title="连边（依次点两个节点）">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="6" cy="6" r="3" />
                        <circle cx="18" cy="18" r="3" />
                        <path d="M8.5 8.5l7 7" />
                    </svg>
                </button>
                <button class="tool" data-t="del" title="删除（点击节点或边）">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" />
                    </svg>
                </button>
            </div>
            <div class="toolbar-bottom">
                <div class="legend">
                    <span><s class="l-idle"></s>未访问</span>
                    <span><s class="l-fr"></s>访问中</span>
                    <span><s class="l-done"></s>已确定</span>
                    <span><s class="l-path"></s>路径边</span>
                </div>
                <button class="btn" id="btnReplay" disabled title="演算结束后回放路径">↩ 回放路径</button>
            </div>
            <div id="wbox"><input id="winp" type="text" placeholder="w"></div>
            <div class="toast" id="toast"></div>
        </div>

        <div class="col">
            <div class="sec">
                <h2><i>05</i>选择算法</h2>
                <div class="algo-list">
                    <button class="algo on" data-a="bfs">
                        <div><b>广度优先搜索 BFS</b><small>逐层扩散</small></div>
                    </button>
                    <button class="algo" data-a="dfs">
                        <div><b>深度优先搜索 DFS</b><small>递归深入</small></div>
                    </button>
                    <button class="algo" data-a="dij">
                        <div><b>Dijkstra 最短路</b><small>贪心松弛</small></div>
                    </button>
                    <button class="algo" data-a="mst">
                        <div><b>Kruskal 最小生成树</b><small>边排序 + 并查集</small></div>
                    </button>
                    <button class="algo" data-a="topo">
                        <div><b>拓扑排序 Kahn</b><small>入度 + 队列</small></div>
                    </button>
                </div>
            </div>
            <div class="sec">
                <h2><i>05b</i>前提与伪代码</h2>
                <div class="prereq" id="prereq">—</div>
                <div class="pseudo" id="pseudo"></div>
            </div>
            <div class="sec">

    <script>
        /* ============================================================
           图 · 算法演算台 v1.9
           + 点边改权 / 无权重跳过弹窗
           + BFS 层号 · Dijkstra d · 路径回放
           + 滚轮缩放 · view 平移
           + 前提与伪代码高亮
           + 拓扑排序 Kahn
        ============================================================ */
        const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
        const stage = document.getElementById('stage');

        const C = {
            bg: '#faf5ec', idle: '#8a7660', idleStroke: '#5c4c38',
            ink: '#2b2117', dim: '#6b5945',
            acid: '#a86e00', ember: '#d95f2b', rose: '#c9683c', nodeFill: '#fffdf8'
        };

        const G = { directed: false, weighted: false, nodes: [], edges: [], view: { x: 0, y: 0, scale: 1 } };

        const LAYOUT = { ideal: 135, repel: 115, gravity: 0.012 };
        const SIM = { temp: 1, asleep: false, stillFrames: 0, gravity: false };

        function wake() { SIM.temp = 1; SIM.asleep = false; SIM.stillFrames = 0; }
        function wakeGently() { SIM.temp = Math.max(SIM.temp, 0.35); SIM.asleep = false; SIM.stillFrames = 0; }
        function sleepNow() { SIM.asleep = true; SIM.temp = 0; SIM.stillFrames = 0; }

        const findNode = id => G.nodes.find(n => n.id === id);
        const R = 26;

        function toast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            clearTimeout(t._tm); t._tm = setTimeout(() => t.classList.remove('show'), 2400);
        }

        /* ---------- 坐标：屏幕 ↔ 世界 ---------- */
        function screenToWorld(sx, sy) {
            return {
                x: (sx - G.view.x) / G.view.scale,
                y: (sy - G.view.y) / G.view.scale
            };
        }
        function worldToScreen(wx, wy) {
            return {
                x: wx * G.view.scale + G.view.x,
                y: wy * G.view.scale + G.view.y
            };
        }

        function parseEdges(text) {
            const out = [];
            text.split(/\n/).forEach(line => {
                const s = line.trim();
                if (!s || s.startsWith('#')) return;
                const parts = s.split(/[\s,;]+|->|-+|—+/).filter(Boolean);
                if (parts.length >= 2) {
                    let w = 1;
                    if (parts.length >= 3) { const n = parseFloat(parts[2]); if (isFinite(n)) w = n; }
                    out.push({ from: parts[0], to: parts[1], w });
                }
            });
            return out;
        }

        function buildGraph(text, keepPos) {
            const list = parseEdges(text);
            if (!list.length) { toast('未能解析出任何边，请检查格式'); return; }
            const old = keepPos ? Object.fromEntries(G.nodes.map(n => [n.id, n])) : {};
            const ids = new Set();
            list.forEach(e => { ids.add(e.from); ids.add(e.to); });
            const cw = (cv.clientWidth || 800) / G.view.scale;
            const ch = (cv.clientHeight || 600) / G.view.scale;
            const ox = -G.view.x / G.view.scale, oy = -G.view.y / G.view.scale;
            G.nodes = [...ids].map((id, i) => {
                const o = old[id];
                return {
                    id,
                    x: o ? o.x : ox + cw / 2 + Math.cos(i / ids.size * Math.PI * 2) * 140 + (Math.random() - 0.5) * 40,
                    y: o ? o.y : oy + ch / 2 + Math.sin(i / ids.size * Math.PI * 2) * 100 + (Math.random() - 0.5) * 40,
                    state: 'idle', show: null, fixed: !!o
                };
            });
            G.edges = list.map(e => ({ from: e.from, to: e.to, w: e.w, state: 'idle' }));
            refreshInfo(); refreshStructure(); resetAlgo();
            wake();
        }

        const PRESETS = {
            classic:
                'A B 4\nA C 2\nB C 5\nB D 10\nC E 3\nE D 4\nD F 11\nE F 8\nC D 8',
            grid: (() => {
                let s = [];
                for (let r = 0; r < 3; r++) for (let c = 0; c < 4; c++) {
                    const n = String.fromCharCode(65 + r * 4 + c);
                    if (c < 3) s.push(n + ' ' + String.fromCharCode(66 + r * 4 + c) + ' 1');
                    if (r < 2) s.push(n + ' ' + String.fromCharCode(77 + r * 4 + c) + ' 1');
                }
                return s.join('\n');
            })(),
            dense: (() => {
                const names = ['A', 'B', 'C', 'D', 'E', 'F', 'G'];
                let s = [];
                for (let i = 0; i < names.length; i++) for (let j = i + 1; j < names.length; j++) {
                    if (Math.random() < 0.55) { s.push(names[i] + ' ' + names[j] + ' ' + (1 + Math.floor(Math.random() * 9))); }
                }
                return s.join('\n');
            })()
        };

        const TOPOLOGY = [
            {
                id: 'star', name: '星图', tag: 'Star',
                desc: '中心节点连接所有叶节点，叶节点之间无边。树高 1，网络 hub 结构原型。',
                build: function () {
                    const n = 9, edges = [];
                    for (let i = 1; i <= n; i++) edges.push('S ' + String.fromCharCode(64 + i));
                    const coords = { S: [0, 0] };
                    for (let i = 1; i <= n; i++) coords[String.fromCharCode(64 + i)] = [-Math.PI / 2 + i / n * Math.PI * 2, .85];
                    return { edges: edges, coords: coords };
                }
            },
            {
                id: 'chrys', name: '菊花图', tag: '内环+放射',
                desc: '内环构成环 + 每个内环节点各带一个外挂叶节点。测试 BFS 层间扩散与环回边的经典形态。',
                build: function () {
                    const n = 7, edges = [];
                    const inner = [], outer = [];
                    for (let i = 0; i < n; i++) {
                        inner.push(String.fromCharCode(65 + i));
                        outer.push(String.fromCharCode(65 + n + i));
                    }
                    for (let i = 0; i < n; i++) edges.push(inner[i] + ' ' + inner[(i + 1) % n]);
                    for (let i = 0; i < n; i++) edges.push(inner[i] + ' ' + outer[i]);
                    const coords = {};
                    for (let i = 0; i < n; i++) {
                        const a = -Math.PI / 2 + i / n * Math.PI * 2;
                        coords[inner[i]] = [a, .45];
                        coords[outer[i]] = [a, .95];
                    }
                    return { edges: edges, coords: coords };
                }
            },
            {
                id: 'path', name: '路径图', tag: '单链',
                desc: '最简单的连通图：每个节点度数 ≤ 2。DFS 会一次走完全程不回溯；BFS 逐层推进。',
                build: function () {
                    const n = 9, edges = [];
                    for (let i = 0; i < n - 1; i++) edges.push(String.fromCharCode(65 + i) + ' ' + String.fromCharCode(66 + i));
                    return { edges: edges, coords: { type: 'line', count: n } };
                }
            },
            {
                id: 'cycle', name: '环形图', tag: '首尾相连',
                desc: '每个节点度数恰为 2。BFS 从任一点扩散成两臂对进；删除任一条边即退化为路径图。',
                build: function () {
                    const n = 10, edges = [];
                    for (let i = 0; i < n; i++) edges.push(String.fromCharCode(65 + i) + ' ' + String.fromCharCode(65 + (i + 1) % n));
                    const coords = {};
                    for (let i = 0; i < n; i++) coords[String.fromCharCode(65 + i)] = [-Math.PI / 2 + i / n * Math.PI * 2, .8];
                    return { edges: edges, coords: coords };
                }
            },
            {
                id: 'complete', name: '完全图', tag: 'K6 全连',
                desc: '每个节点度数 = n−1，边数 = n(n−1)/2。K6 有 15 条边，是稠密图的极端形态。',
                build: function () {
                    const n = 6, edges = [];
                    for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++)
                        edges.push(String.fromCharCode(65 + i) + ' ' + String.fromCharCode(65 + j));
                    const coords = {};
                    for (let i = 0; i < n; i++) coords[String.fromCharCode(65 + i)] = [-Math.PI / 2 + i / n * Math.PI * 2, .8];
                    return { edges: edges, coords: coords };
                }
            },
            {
                id: 'bipartite', name: '二分图', tag: 'K3,3',
                desc: '节点分两部 X/Y，边只跨部不连内部。K₃,₃ 是最小非平面图的经典例子。',
                build: function () {
                    const X = ['X1', 'X2', 'X3'], Y = ['Y1', 'Y2', 'Y3'], edges = [];
                    X.forEach(x => Y.forEach(y => edges.push(x + ' ' + y)));
                    return { edges: edges, coords: { type: 'columns', left: X, right: Y } };
                }
            },
            {
                id: 'tree', name: '树', tag: '无环连通',
                desc: 'n−1 条边、无环、连通、任意两点唯一路径——四个等价定义在此图上同时成立。',
                build: function () {
                    const edges = [
                        'A B', 'A C', 'B D', 'B E', 'C F', 'C G', 'D H', 'E I', 'F J', 'G K', 'H L', 'I M'
                    ];
                    const coords = {
                        A: [.5, .08], B: [.25, .36], C: [.75, .36],
                        D: [.12, .64], E: [.37, .64], F: [.63, .64], G: [.88, .64],
                        H: [.05, .92], I: [.20, .92], J: [.56, .92], K: [.81, .92],
                        L: [.0, 1.0], M: [.14, 1.0]
                    };
                    return { edges: edges, coords: { type: 'tree', coords: coords } };
                }
            },
            {
                id: 'wheel', name: '轮图', tag: 'W7 环+辐',
                desc: '环图加一个中心全连：中心到环上每点各一条辐条。半径小、直径为 2 的稠密结构。',
                build: function () {
                    const n = 7, edges = [];
                    for (let i = 0; i < n; i++) edges.push(String.fromCharCode(65 + i) + ' ' + String.fromCharCode(65 + (i + 1) % n));
                    for (let i = 0; i < n; i++) edges.push('W ' + String.fromCharCode(65 + i));
                    const coords = { W: [0, 0] };
                    for (let i = 0; i < n; i++) coords[String.fromCharCode(65 + i)] = [-Math.PI / 2 + i / n * Math.PI * 2, .85];
                    return { edges: edges, coords: coords };
                }
            }
        ];

        function loadTopology(t) {
            const r = t.build();
            document.getElementById('edges').value = r.edges.join('\n');
            G.view = { x: 0, y: 0, scale: 1 };
            buildGraph(r.edges.join('\n'), false);

            const W = stage.clientWidth, H = stage.clientHeight;
            const cx = W / 2, cy = H / 2;
            const maxR = Math.min(W, H) / 2 - 50;
            const coords = r.coords;

            if (coords.type === 'line') {
                G.nodes.forEach(function (n, i) {
                    const t2 = i / (G.nodes.length - 1 || 1);
                    n.x = 80 + t2 * (W - 160);
                    n.y = H / 2;
                    n.fixed = true;
                });
            } else if (coords.type === 'columns') {
                const put = function (list, xLeft) {
                    list.forEach(function (id, i) {
                        const node = findNode(id);
                        if (!node) return;
                        node.x = xLeft ? W * 0.22 : W * 0.78;
                        node.y = H * 0.5 + (i - (list.length - 1) / 2) * (H * 0.24);
                        node.fixed = true;
                    });
                };
                put(coords.left, true);
                put(coords.right, false);
            } else if (coords.type === 'tree') {
                G.nodes.forEach(function (n) {
                    const c = coords.coords[n.id];
                    if (c) { n.x = 40 + c[0] * (W - 80); n.y = 40 + c[1] * (H - 90); n.fixed = true; }
                });
            } else {
                G.nodes.forEach(function (n) {
                    const c = coords[n.id];
                    if (c) {
                        n.x = cx + Math.cos(c[0]) * c[1] * maxR;
                        n.y = cy + Math.sin(c[0]) * c[1] * maxR;
                        n.fixed = true;
                    }
                });
            }

            refreshStructure();
            resetAlgo();
            sleepNow();
            setStat('已载入「' + t.name + '」：' + G.nodes.length + ' 节点 / ' + G.edges.length + ' 边');
            P.stepN = 0;
            log('载入典型结构「' + t.name + '」— ' + t.tag, true);
            const note = document.getElementById('exnote');
            note.innerHTML = '<b>' + t.name + ' ·</b> ' + t.desc;
            note.classList.add('show');
            toast('已载入：' + t.name);
        }

        function renderTopologies() {
            const box = document.getElementById('topoList');
            box.innerHTML = TOPOLOGY.map(function (t) {
                return '<button class="chip topo" data-t="' + t.id + '" title="' + t.desc + '"><b>' + t.name + '</b><small>' + t.tag + '</small></button>';
            }).join('');
            box.addEventListener('click', function (ev) {
                const b = ev.target.closest('.chip'); if (!b) return;
                const t = TOPOLOGY.find(function (x) { return x.id === b.dataset.t; });
                if (t) loadTopology(t);
            });
        }

        const EXAMPLES = [
            {
                id: 'bfs1', algo: 'bfs', name: '同心扩散', tag: '跨层捷径',
                directed: false, weighted: false, start: 'S', end: 'H',
                note: '观察队列如何<strong>逐层扩散</strong>：S → (A,B,C) → (D,E,H,F,G)。注意跨越边 A—H：H 经 A 在第 2 层就被发现。节点下方显示<strong>层号</strong>。可选终点后可回放路径。',
                edges: 'S A\nS B\nS C\nA D\nA E\nA H\nB F\nC G\nE H',
                coords: {
                    S: [.50, .55], A: [.30, .42], B: [.50, .30], C: [.70, .42],
                    D: [.18, .20], E: [.40, .14], H: [.62, .14], F: [.50, .82], G: [.82, .20]
                }
            },
            {
                id: 'dfs1', algo: 'dfs', name: '深入与回溯', tag: '有向深链',
                directed: true, weighted: false, start: 'A', end: '',
                note: '有向图演示 DFS 的「一根筋走到黑」：A→B 一路深入到 C→D，D 无路可走开始<strong>回溯</strong>；回到 B 再探索分叉 E→F。',
                edges: 'A B\nB C\nC D\nB E\nE F\nF D\nA G',
                coords: {
                    A: [.12, .50], B: [.34, .36], C: [.56, .24], D: [.78, .14],
                    E: [.34, .74], F: [.58, .86], G: [.12, .18]
                }
            },
            {
                id: 'dij1', algo: 'dij', name: '贪心的陷阱', tag: '绕远反而近',
                directed: false, weighted: true, start: 'A', end: 'B',
                note: '直连边 A—B 权重高达 <strong>10</strong>，绕行 A→C→D→B 总长仅 3。节点下方常驻 <strong>d 值</strong>，结束后可回放最短路径。',
                edges: 'A B 10\nA C 1\nC D 1\nD B 1\nA F 2\nF B 2',
                coords: { A: [.10, .50], B: [.90, .50], C: [.38, .24], D: [.62, .28], F: [.50, .80] }
            },
            {
                id: 'mst1', algo: 'mst', name: '环的陷阱', tag: '低权未必入选',
                directed: false, weighted: true, start: '', end: '',
                note: '所有边按权重升序考察：A—C(1.5) 看似便宜，两端已连通 → <strong>成环，舍弃</strong>！',
                edges: 'A B 1\nB C 1\nA C 1.5\nC D 2\nB D 2.5\nD E 3\nA E 4',
                coords: { A: [.22, .72], B: [.14, .36], C: [.44, .30], D: [.70, .34], E: [.86, .72] }
            },
            {
                id: 'topo1', algo: 'topo', name: '课表依赖', tag: '有向无环',
                directed: true, weighted: false, start: '', end: '',
                note: 'Kahn：反复取出<strong>入度为 0</strong> 的节点入队。观察入度表如何被边「消耗」。若最终序长 &lt; n，则存在环。',
                edges: 'A C\nB C\nC D\nC E\nD F\nE F\nB E',
                coords: { A: [.15, .25], B: [.15, .75], C: [.40, .40], D: [.65, .25], E: [.65, .75], F: [.88, .50] }
            }
        ];

        function renderExamples() {
            const box = document.getElementById('exlist');
            const algoNames = { bfs: 'BFS', dfs: 'DFS', dij: 'Dijkstra', mst: 'Kruskal', topo: '拓扑' };
            const groups = {};
            EXAMPLES.forEach(function (ex) { (groups[ex.algo] = groups[ex.algo] || []).push(ex); });
            box.innerHTML = Object.keys(groups).map(function (a) {
                const list = groups[a];
                return '<div class="exgroup">'
                    + '<div class="gt">' + algoNames[a] + '</div>'
