                    + list.map(function (ex) {
                        return '<button class="exchip" data-ex="' + ex.id + '" title="' + ex.note.replace(/<[^>]+>/g, '') + '"><b>' + ex.name + '</b><small>' + ex.tag + '</small></button>';
                    }).join('')
                    + '</div></div>';
            }).join('');
        }
        function loadExample(ex) {
            document.getElementById('edges').value = ex.edges;
            G.directed = ex.directed; G.weighted = ex.weighted;
            G.view = { x: 0, y: 0, scale: 1 };
            setToggleUI('tgDir', ex.directed);
            setToggleUI('tgW', ex.weighted);
            selectAlgo(ex.algo);
            buildGraph(ex.edges, false);
            if (ex.coords) {
                const W = stage.clientWidth, H = stage.clientHeight;
                G.nodes.forEach(function (n) {
                    const c = ex.coords[n.id];
                    if (c) { n.x = 60 + c[0] * (W - 120); n.y = 50 + c[1] * (H - 110); n.fixed = true; }
                });
            }
            refreshStructure();
            const selS = document.getElementById('selStart'), selE = document.getElementById('selEnd');
            if (ex.start && Array.from(selS.options).some(o => o.value === ex.start)) selS.value = ex.start;
            if (ex.end && Array.from(selE.options).some(o => o.value === ex.end)) selE.value = ex.end;
            resetAlgo();
            const note = document.getElementById('exnote');
            note.innerHTML = '<b>演示要点 ·</b> ' + ex.note;
            note.classList.add('show');
            setStat('示例「' + ex.name + '」已就绪' + (ex.start ? ' · 起点 ' + ex.start : '') + (ex.end ? ' · 终点 ' + ex.end : ''));
            P.stepN = 0;
            log('载入示例「' + ex.name + '」', true);
            toast('已载入：' + ex.name);
            sleepNow();
            if (document.getElementById('autoRun').checked) {
                setTimeout(startAlgo, 350);
            }
        }
        function setToggleUI(id, v) {
            const box = document.getElementById(id);
            box.querySelectorAll('button').forEach(function (b) {
                b.classList.toggle('on', (b.dataset.v === '1') === !!v);
            });
        }

        function adjList() {
            const map = {};
            G.nodes.forEach(n => map[n.id] = []);
            G.edges.forEach(e => {
                map[e.from] && map[e.from].push([e.to, e.w]);
                if (!G.directed && map[e.to]) map[e.to].push([e.from, e.w]);
            });
            return map;
        }
        function refreshStructure() {
            const m = adjList();
            document.getElementById('adj').innerHTML = G.nodes.length
                ? G.nodes.map(n => {
                    const list = (m[n.id] || []).map(p => p[0] + (G.weighted ? '<span class="w">(' + p[1] + ')</span>' : '')).join(' ');
                    return '<div><b>' + n.id + '</b>→ ' + (list || '∅') + '</div>';
                }).join('')
                : '—';
            const mx = document.getElementById('matrix');
            if (G.nodes.length > 13) { mx.innerHTML = '<span class="empty">节点超过 13 个，矩阵略</span>'; return; }
            if (!G.nodes.length) { mx.innerHTML = '—'; return; }
            const idx = {};
            G.nodes.forEach(function (n, i) { idx[n.id] = i; });
            const grid = G.nodes.map(() => G.nodes.map(() => null));
            G.edges.forEach(function (e) {
                grid[idx[e.from]][idx[e.to]] = e.w;
                if (!G.directed) grid[idx[e.to]][idx[e.from]] = e.w;
            });
            let h = '<table class="matrix"><tr><th></th>' + G.nodes.map(n => '<th>' + n.id + '</th>').join('') + '</tr>';
            G.nodes.forEach(function (n, i) {
                h += '<tr><th>' + n.id + '</th>' + grid[i].map(v => '<td class="' + (v !== null ? 'on' : '') + '">' + (v !== null ? (G.weighted ? v : '1') : '') + '</td>').join('') + '</tr>';
            });
            mx.innerHTML = h + '</table>';
        }
        function refreshInfo() {
            document.getElementById('ftInfo').textContent = G.nodes.length + ' 节点 / ' + G.edges.length + ' 边 · 缩放 ' + G.view.scale.toFixed(2) + '×';
            const ids = G.nodes.map(n => n.id);
            ['selStart', 'selEnd'].forEach(function (id) {
                const sel = document.getElementById(id);
                const keep = sel.value;
                sel.innerHTML = (id === 'selEnd' ? '<option value="">（无）</option>' : '') + ids.map(x => '<option>' + x + '</option>').join('');
                if (ids.includes(keep)) sel.value = keep;
                else if (id === 'selStart' && ids.length) sel.value = ids[0];
            });
        }

        /* ---------- 伪代码 ---------- */
        const META = {
            bfs: {
                prereq: '<b>前提</b>：任意图均可。无权图上 BFS 得到的树边构成最短路径（边数意义）。可选终点用于路径回放。',
                lines: [
                    'queue ← [s]；vis ← {s}；depth[s] ← 0',
                    'while queue 非空：',
                    '  u ← queue 出队',
                    '  for v ∈ 邻接(u)：',
                    '    if v ∉ vis：',
                    '      vis.add(v)；queue.入队(v)',
                    '      depth[v] ← depth[u]+1；记 parent',
                    '    else 跳过（层内/回边）',
                    '结束；可按 parent 回放 s→t'
                ]
            },
            dfs: {
                prereq: '<b>前提</b>：任意图。不保证最短路；适合连通性、环检测、拓扑（有向无环时）。',
                lines: [
                    'vis ← ∅',
                    'function DFS(u)：',
                    '  vis.add(u)；标记访问中',
                    '  for v ∈ 邻接(u)：',
                    '    if v ∉ vis：沿树边深入 DFS(v)',
                    '    else 跳过',
                    '  标记 u 完成并回溯',
                    'DFS(s)'
                ]
            },
            dij: {
                prereq: '<b>前提</b>：边权非负。有负权请用 Bellman-Ford。节点下方常驻 d 值。',
                lines: [
                    'd[s]←0；其余 d←∞；parent←null',
                    'while 存在未确定节点：',
                    '  u ← 未确定中 d 最小者；确定 u',
                    '  for (u,v,w) ∈ 出边：',
                    '    if d[u]+w < d[v]：',
                    '      d[v] ← d[u]+w；parent[v]←u  // 松弛',
                    '若给定 t：按 parent 回放路径'
                ]
            },
            mst: {
                prereq: '<b>前提</b>：无向连通图。Kruskal：按权升序选边，用并查集避免成环；共选 n−1 条。',
                lines: [
                    '边按权重升序排序',
                    '每个点自成连通分量（并查集）',
                    'for 每条边 (u,v,w) 按序：',
                    '  if find(u) ≠ find(v)：',
                    '    合并；边入选 MST',
                    '  else 成环，舍弃',
                    '选满 n−1 条后结束'
                ]
            },
            topo: {
                prereq: '<b>前提</b>：有向无环图（DAG）。Kahn：反复取入度为 0 的点。若结果长度 &lt; n 则有环。',
                lines: [
                    '计算每个点入度 indeg[]',
                    'queue ← 所有 indeg=0 的点',
                    'order ← []',
                    'while queue 非空：',
                    '  u ← 出队；order.append(u)',
                    '  for v ∈ 出边(u)：',
                    '    indeg[v]--',
                    '    if indeg[v]=0：入队',
                    'if |order|<n：存在有向环'
                ]
            }
        };

        function renderPseudo(lineIdx) {
            const m = META[algo];
            if (!m) return;
            document.getElementById('prereq').innerHTML = m.prereq;
            const box = document.getElementById('pseudo');
            box.innerHTML = m.lines.map(function (ln, i) {
                return '<div class="pl' + (i === lineIdx ? ' on' : '') + '"><span class="ln">' + (i + 1) + '</span>' + ln + '</div>';
            }).join('');
            const on = box.querySelector('.pl.on');
            if (on) on.scrollIntoView({ block: 'nearest' });
        }
        function hl(line) { renderPseudo(line); }

        /* ---------- 渲染 ---------- */
        function resize() {
            const dpr = window.devicePixelRatio || 1;
            cv.width = stage.clientWidth * dpr; cv.height = stage.clientHeight * dpr;
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener('resize', resize);

        function edgeCurve(e) {
            const pair = G.edges.filter(o => {
                const a = o.from === e.from && o.to === e.to;
                const b = o.from === e.to && o.to === e.from;
                return a || b;
            });
            if (pair.length <= 1) return 0;
            const i = pair.indexOf(e);
            return (i - (pair.length - 1) / 2) * 34;
        }
        function edgeGeom(e) {
            const a = findNode(e.from), b = findNode(e.to);
            const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
            const dx = b.x - a.x, dy = b.y - a.y, len = Math.hypot(dx, dy) || 1;
            const cur = edgeCurve(e);
            const cx = mx - dy / len * cur, cy = my + dx / len * cur;
            return { a: a, b: b, cx: cx, cy: cy, len: len };
        }
        function qPoint(t, g) {
            const it = 1 - t;
            return {
                x: it * it * g.a.x + 2 * it * t * g.cx + t * t * g.b.x,
                y: it * it * g.a.y + 2 * it * t * g.cy + t * t * g.b.y
            };
        }
        function edgeStateColor(s) {
            return s === 'path' ? C.acid : s === 'active' ? C.ember : s === 'done' ? C.acid : C.idle;
        }

        let frame = 0;
        let tool = 'select', hover = null, draggingNode = null;
        let pending = { from: null };
        let panning = false, panStart = null;

        function draw() {
            requestAnimationFrame(draw);
            frame++;
            const W = stage.clientWidth, H = stage.clientHeight;
            ctx.clearRect(0, 0, W, H);

            ctx.fillStyle = C.bg; ctx.fillRect(0, 0, W, H);

            ctx.save();
            ctx.translate(G.view.x, G.view.y);
            ctx.scale(G.view.scale, G.view.scale);

            // 网格（世界坐标）
            const inv = 1 / G.view.scale;
            const x0 = Math.floor((-G.view.x) * inv / 44) * 44 - 44;
            const y0 = Math.floor((-G.view.y) * inv / 44) * 44 - 44;
            const x1 = x0 + W * inv + 88, y1 = y0 + H * inv + 88;
            ctx.strokeStyle = '#e8dfcc'; ctx.lineWidth = 1 / G.view.scale;
            ctx.beginPath();
            for (let x = x0; x < x1; x += 44) { ctx.moveTo(x, y0); ctx.lineTo(x, y1); }
            for (let y = y0; y < y1; y += 44) { ctx.moveTo(x0, y); ctx.lineTo(x1, y); }
            ctx.stroke();

            G.edges.forEach(function (e) {
                const g = edgeGeom(e);
                const col = edgeStateColor(e.state);
                const isPath = e.state === 'path' || e.state === 'done';
                ctx.strokeStyle = col;
                ctx.lineWidth = (isPath ? 3.6 : 2) / Math.sqrt(G.view.scale);
                if (e.state === 'active') ctx.lineWidth = 4 / Math.sqrt(G.view.scale);
                ctx.beginPath();
                ctx.moveTo(g.a.x, g.a.y);
                ctx.quadraticCurveTo(g.cx, g.cy, g.b.x, g.b.y);
                ctx.stroke();

                if (G.directed) {
                    const t = 1 - (R + 12) / g.len * 0.9;
                    const p = qPoint(Math.max(0.05, Math.min(0.95, t)), g);
                    const p2 = qPoint(Math.max(0.05, Math.min(0.95, t - 0.06)), g);
                    const ang = Math.atan2(p.y - p2.y, p.x - p2.x);
                    ctx.fillStyle = col;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - 13 * Math.cos(ang - 0.42), p.y - 13 * Math.sin(ang - 0.42));
                    ctx.lineTo(p.x - 13 * Math.cos(ang + 0.42), p.y - 13 * Math.sin(ang + 0.42));
                    ctx.fill();
                }

                if (G.weighted) {
                    const m = qPoint(0.5, g);
                    ctx.font = '600 13px Consolas, monospace';
                    const tw = ctx.measureText(String(e.w)).width + 14;
                    ctx.fillStyle = '#fffdf8';
                    ctx.fillRect(m.x - tw / 2, m.y - 11, tw, 20);
                    ctx.strokeStyle = e.state === 'idle' ? '#b5a486' : col;
                    ctx.lineWidth = 1;
                    ctx.strokeRect(m.x - tw / 2, m.y - 11, tw, 20);
                    ctx.fillStyle = e.state === 'idle' ? C.dim : col;
                    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(e.w, m.x, m.y);
                }
            });

            G.nodes.forEach(function (n) {
                const st = n.state;
                const fill = st === 'done' ? C.acid
                    : st === 'active' ? C.ember
                        : st === 'frontier' ? C.rose : C.nodeFill;
                const stroke = st === 'idle' ? C.idleStroke
                    : st === 'active' ? '#b84a1d'
                        : st === 'frontier' ? '#a8512c' : '#7d5200';
                const textColor = st === 'idle' ? C.ink : '#fffdf8';

                if (st === 'active') {
                    const ph = (Math.sin(frame * 0.18) + 1) / 2;
                    ctx.strokeStyle = C.ember; ctx.globalAlpha = 0.45 * (1 - ph);
                    ctx.lineWidth = 2.5;
                    ctx.beginPath(); ctx.arc(n.x, n.y, R + 5 + ph * 11, 0, Math.PI * 2); ctx.stroke();
                    ctx.globalAlpha = 1;
                }
                if (st === 'done') {
                    ctx.strokeStyle = 'rgba(168,110,0,.25)';
                    ctx.lineWidth = 7;
                    ctx.beginPath(); ctx.arc(n.x, n.y, R + 4, 0, Math.PI * 2); ctx.stroke();
                }

                ctx.beginPath(); ctx.arc(n.x, n.y, R, 0, Math.PI * 2);
                ctx.fillStyle = fill; ctx.fill();
                ctx.strokeStyle = stroke; ctx.lineWidth = 2.6; ctx.stroke();

                ctx.font = '700 16px Consolas, monospace';
                ctx.fillStyle = textColor; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(n.id, n.x, n.y - (n.show != null ? 4 : 0));

                if (n.show != null) {
                    ctx.font = '600 13px Consolas, monospace';
                    ctx.fillStyle = C.acid;
                    ctx.fillText(n.show, n.x, n.y + R + 15);
                }
            });

            if (pending.from && hover) {
                const a = findNode(pending.from);
                ctx.setLineDash([6, 6]);
                ctx.strokeStyle = C.ember; ctx.lineWidth = 2;
                ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(hover.x, hover.y); ctx.stroke();
                ctx.setLineDash([]);
            }

            ctx.restore();

            if (!draggingNode && !SIM.asleep) forceTick();
        }

        function forceTick() {
            const k = 0.25 * SIM.temp;
            let maxDisp = 0;
            function move(n, dx, dy) {
                const ox = n.x, oy = n.y;
                n.x += dx; n.y += dy;
                const d = Math.hypot(n.x - ox, n.y - oy);
                if (d > maxDisp) maxDisp = d;
            }
            const W = stage.clientWidth / G.view.scale;
            const H = stage.clientHeight / G.view.scale;
            const cx = (-G.view.x / G.view.scale) + W / 2;
            const cy = (-G.view.y / G.view.scale) + H / 2;
            const N = G.nodes;
            for (let i = 0; i < N.length; i++) for (let j = i + 1; j < N.length; j++) {
                const a = N[i], b = N[j];
                let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
                if (d < LAYOUT.repel) {
                    const f = k * 900 / d;
                    dx /= d; dy /= d;
                    if (!a.fixed) move(a, -dx * f, -dy * f);
                    if (!b.fixed) move(b, dx * f, dy * f);
                }
            }
            G.edges.forEach(function (e) {
                const a = findNode(e.from), b = findNode(e.to);
                if (!a || !b) return;
                let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
                const f = (d - LAYOUT.ideal) * 0.004 * k * d * 0.02;
                dx /= d; dy /= d;
                if (!a.fixed) move(a, dx * f, dy * f);
                if (!b.fixed) move(b, -dx * f, -dy * f);
            });
            if (SIM.gravity) {
                G.nodes.forEach(function (n) {
                    if (n.fixed) return;
                    const dx = cx - n.x, dy = cy - n.y;
                    move(n, dx * LAYOUT.gravity * k * 8, dy * LAYOUT.gravity * k * 8);
                });
            }
            SIM.temp *= 0.985;
            if (maxDisp < 0.3) {
                SIM.stillFrames++;
                if (SIM.stillFrames > 45) { SIM.asleep = true; SIM.gravity = false; }
            } else SIM.stillFrames = 0;
        }

        function strongLayout() {
            G.nodes.forEach(function (n) { n.fixed = false; });
            wake();
            SIM.gravity = true;
            let cnt = 0;
            function run() {
                forceTick(); forceTick();
                cnt++;
                if (cnt < 180) { requestAnimationFrame(run); }
                else { SIM.gravity = false; }
            }
            run();
            toast('紧凑布局整理完成');
        }

        /* ---------- 交互 ---------- */
        function hitNode(wx, wy) {
            for (let i = G.nodes.length - 1; i >= 0; i--) {
                const n = G.nodes[i];
                if (Math.hypot(n.x - wx, n.y - wy) <= R + 6) return n;
            }
            return null;
        }
        function hitEdge(wx, wy) {
            const thr = 11 / G.view.scale;
            for (let i = G.edges.length - 1; i >= 0; i--) {
                const e = G.edges[i], g = edgeGeom(e);
                for (let t = 0; t <= 1.001; t += 0.04) {
                    const p = qPoint(t, g);
                    if (Math.hypot(p.x - wx, p.y - wy) < thr) return e;
                }
            }
            return null;
        }
        function nextName() {
            const used = new Set(G.nodes.map(n => n.id));
            for (let i = 0; i < 26; i++) {
                const c = String.fromCharCode(65 + i);
                if (!used.has(c)) return c;
            }
            let i = 1; while (used.has('N' + i)) i++;
            return 'N' + i;
        }

        const wbox = document.getElementById('wbox'), winp = document.getElementById('winp');
        let wctx = null; // {mode:'add'|'edit', from,to, edge?}

        function openWeightBox(sx, sy, from, to, edge) {
            wctx = edge ? { mode: 'edit', edge: edge } : { mode: 'add', from: from, to: to };
            wbox.style.display = 'block';
            wbox.style.left = sx + 'px'; wbox.style.top = sy + 'px';
            winp.value = edge ? edge.w : 1;
            winp.focus(); winp.select();
        }
        function closeWeightBox(ok) {
            if (wctx && ok) {
                const w = parseFloat(winp.value);
                const val = isFinite(w) ? w : 1;
                if (wctx.mode === 'add') {
                    G.edges.push({ from: wctx.from, to: wctx.to, w: val, state: 'idle' });
                } else if (wctx.mode === 'edit' && wctx.edge) {
                    wctx.edge.w = val;
                    // 同步 textarea 可选：略
                }
                refreshInfo(); refreshStructure();
                wakeGently();
            }
            wbox.style.display = 'none'; wctx = null;
        }
        winp.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter') { ev.preventDefault(); closeWeightBox(true); }
            if (ev.key === 'Escape') closeWeightBox(false);
        });
        winp.addEventListener('blur', function () { setTimeout(function () { closeWeightBox(true); }, 100); });

        function addEdgeDirect(from, to) {
            G.edges.push({ from: from, to: to, w: 1, state: 'idle' });
            refreshInfo(); refreshStructure();
            wakeGently();
            toast('已添加边 ' + from + (G.directed ? '→' : '—') + to);
        }

        cv.addEventListener('pointerdown', function (ev) {
            const r = cv.getBoundingClientRect();
            const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
            const w = screenToWorld(sx, sy);
            const x = w.x, y = w.y;

            if (tool === 'select') {
                const n = hitNode(x, y);
                if (n) { draggingNode = n; n.fixed = true; }
                else {
                    const e = hitEdge(x, y);
                    if (e && G.weighted) {
                        openWeightBox(sx, sy, e.from, e.to, e);
                    } else {
                        panning = true; panStart = { x: sx, y: sy };
                    }
                }
            }
            else if (tool === 'node') {
                G.nodes.push({ id: nextName(), x: x, y: y, state: 'idle', show: null, fixed: false });
                refreshInfo(); refreshStructure();
                wakeGently();
            }
            else if (tool === 'edge') {
                const n = hitNode(x, y);
                if (n) {
                    if (!pending.from) { pending.from = n.id; }
                    else if (pending.from !== n.id) {
                        if (G.weighted) {
                            const a = findNode(pending.from);
                            const mid = worldToScreen((a.x + n.x) / 2, (a.y + n.y) / 2);
                            openWeightBox(mid.x, mid.y, pending.from, n.id, null);
                        } else {
                            addEdgeDirect(pending.from, n.id);
                        }
                        pending.from = null;
                    }
                }
            }
            else if (tool === 'del') {
                const n = hitNode(x, y);
                if (n) {
                    G.nodes = G.nodes.filter(function (o) { return o !== n; });
                    G.edges = G.edges.filter(function (e) { return e.from !== n.id && e.to !== n.id; });
                    refreshInfo(); refreshStructure();
                    wakeGently();
                } else {
                    const e = hitEdge(x, y);
                    if (e) {
                        G.edges = G.edges.filter(function (o) { return o !== e; });
                        refreshInfo(); refreshStructure();
                        wakeGently();
                    }
                }
            }
            if (cv.setPointerCapture) { try { cv.setPointerCapture(ev.pointerId); } catch (_) { } }
        });
        cv.addEventListener('pointermove', function (ev) {
            const r = cv.getBoundingClientRect();
            const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
            const w = screenToWorld(sx, sy);
            hover = hitNode(w.x, w.y);
            if (draggingNode) { draggingNode.x = w.x; draggingNode.y = w.y; }
            else if (panning && panStart) {
                const dx = sx - panStart.x, dy = sy - panStart.y;
                G.view.x += dx; G.view.y += dy;
                panStart = { x: sx, y: sy };
                refreshInfo();
            }
            cv.style.cursor = tool === 'select' ? (draggingNode ? 'grabbing' : (hover ? 'grab' : 'default')) : 'crosshair';
        });
        cv.addEventListener('pointerup', function () {
            if (draggingNode) wakeGently();
            draggingNode = null; panning = false; panStart = null;
        });
        cv.addEventListener('dblclick', function (ev) {
            const r = cv.getBoundingClientRect();
            const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
            const w = screenToWorld(sx, sy);
            if (!hitNode(w.x, w.y) && !hitEdge(w.x, w.y)) {
                G.nodes.push({ id: nextName(), x: w.x, y: w.y, state: 'idle', show: null, fixed: false });
                refreshInfo(); refreshStructure();
                wakeGently();
            }
        });
        /* 滚轮缩放：以指针为中心 */
        cv.addEventListener('wheel', function (ev) {
            ev.preventDefault();
            const r = cv.getBoundingClientRect();
            const sx = ev.clientX - r.left, sy = ev.clientY - r.top;
            const before = screenToWorld(sx, sy);
            const factor = ev.deltaY < 0 ? 1.08 : 1 / 1.08;
            const ns = Math.min(4, Math.max(0.25, G.view.scale * factor));
            G.view.scale = ns;
            // 保持指针下世界点不变
            G.view.x = sx - before.x * ns;
            G.view.y = sy - before.y * ns;
            refreshInfo();
        }, { passive: false });

        document.getElementById('tools').addEventListener('click', function (ev) {
            const b = ev.target.closest('.tool'); if (!b) return;
            tool = b.dataset.t;
            pending.from = null;
            document.querySelectorAll('.tool').forEach(function (t) { t.classList.toggle('on', t === b); });
        });

        /* ---------- 算法 ---------- */
        let algo = 'bfs';
        function selectAlgo(a) {
            algo = a;
            document.querySelectorAll('.algo').forEach(function (x) { x.classList.toggle('on', x.dataset.a === a); });
            paramUI();
            renderPseudo(-1);
            resetAlgo();
        }
        document.querySelectorAll('.algo').forEach(function (b) {
            b.addEventListener('click', function () { selectAlgo(b.dataset.a); });
        });
        function paramUI() {
            document.getElementById('fStart').style.display = (algo === 'mst' || algo === 'topo') ? 'none' : 'block';
            document.getElementById('fEnd').style.display = (algo === 'dij' || algo === 'bfs') ? 'block' : 'none';
        }
        paramUI();

        let snapshot = null;
        function takeSnap() {
            snapshot = {
                nodes: G.nodes.map(n => ({ id: n.id, state: n.state, show: n.show })),
                edges: G.edges.map(e => ({ from: e.from, to: e.to, w: e.w, state: e.state }))
            };
        }
        function restoreSnap() {
            if (!snapshot) return;
            const ns = {};
            snapshot.nodes.forEach(function (n) { ns[n.id] = n; });
            G.nodes.forEach(function (n) {
                const s = ns[n.id];
                if (s) { n.state = s.state || 'idle'; n.show = s.show; }
                else { n.state = 'idle'; n.show = null; }
            });
            G.edges.forEach(function (e) {
                const s = snapshot.edges.find(function (o) { return o.from === e.from && o.to === e.to && o.w === e.w; });
                e.state = s ? (s.state || 'idle') : 'idle';
            });
        }

        const P = { gen: null, done: true, running: false, timer: null, stepN: 0, speed: 1 };
        /** 路径回放缓存 */
        let PATH_CACHE = null; // {nodes:[], edges pairs}

        const statEl = document.getElementById('stat'), logEl = document.getElementById('log');
        const btnReplay = document.getElementById('btnReplay');

        function log(msg, hlFlag) {
            const emptyP = logEl.querySelector('.empty');
            if (emptyP) logEl.innerHTML = '';
            const p = document.createElement('p');
            if (hlFlag) p.className = 'hl';
            p.innerHTML = '<b>' + String(P.stepN).padStart(2, '0') + '</b>' + msg;
            logEl.appendChild(p);
            logEl.scrollTop = logEl.scrollHeight;
        }
        function setStat(html) { statEl.innerHTML = html; }
        function clearStatLog() {
            logEl.innerHTML = '<p class="empty">尚无记录 — 输入边关系并运行算法</p>';
            setStat('等待演算…'); P.stepN = 0;
        }

        function neighborsOf(id) {
            const out = [];
            G.edges.forEach(function (e) {
                if (e.from === id) out.push({ to: e.to, w: e.w, e: e });
                if (!G.directed && e.to === id) out.push({ to: e.from, w: e.w, e: e });
            });
            return out;
        }

        function markEdge(a, b, st) {
            G.edges.forEach(function (e) {
                if ((e.from === a && e.to === b) || (!G.directed && e.from === b && e.to === a)) e.state = st;
            });
        }

        function setPathCache(pathNodes) {
            if (!pathNodes || pathNodes.length < 2) { PATH_CACHE = null; btnReplay.disabled = true; return; }
            PATH_CACHE = { nodes: pathNodes.slice() };
            btnReplay.disabled = false;
        }

        function* bfsGen(s, t) {
            const vis = new Set([s]);
            const queue = [s];
            const depth = {}; depth[s] = 0;
            const parent = {}; parent[s] = null;
            findNode(s).state = 'frontier';
            findNode(s).show = 'L0';
            hl(0);
            log('初始化：起点 <b>' + s + '</b> 入队，层号 0', true);
            setStat('队列：<span class="q">[' + queue.join(' ') + ']</span>');
            yield;
            while (queue.length) {
                hl(2);
                const u = queue.shift();
                const un = findNode(u);
                un.state = 'active';
                log('出队 <b>' + u + '</b>（层 ' + depth[u] + '），访问邻接', true);
                setStat('队列：<span class="q">[' + queue.join(' ') + ']</span><br>当前：' + u + ' · 层 ' + depth[u]);
                yield;
                hl(3);
                const nbs = neighborsOf(u);
                for (const nb of nbs) {
                    const to = nb.to, e = nb.e;
                    if (!vis.has(to)) {
                        hl(5);
                        vis.add(to);
                        queue.push(to);
                        depth[to] = depth[u] + 1;
                        parent[to] = u;
                        findNode(to).state = 'frontier';
                        findNode(to).show = 'L' + depth[to];
                        e.state = 'done';
                        log('&nbsp;&nbsp;发现 ' + to + ' → 入队（层 ' + depth[to] + '，树边 ' + u + '—' + to + '）');
                        setStat('队列：<span class="q">[' + queue.join(' ') + ']</span><br>当前：' + u + ' · 新发现 ' + to);
                        yield;
                    } else {
                        hl(7);
                        log('&nbsp;&nbsp;' + to + ' 已访问，边 ' + u + '—' + to + ' 跳过');
                    }
                }
                un.state = 'done';
                // 保持层号显示
                un.show = 'L' + depth[u];
                log('<b>' + u + '</b> 处理完毕');
                yield;
            }
            hl(8);
            log('BFS 结束：共访问 ' + vis.size + ' 个节点', true);
            setStat('完成 ✓ &nbsp;访问 ' + vis.size + '/' + G.nodes.length + ' 节点');
            if (t) {
                const path = [];
                let cur = t;
                while (cur != null) { path.unshift(cur); cur = parent[cur]; }
                if (path[0] === s) {
                    for (let i = 0; i < path.length - 1; i++) markEdge(path[i], path[i + 1], 'path');
                    log('最短路径（边数）<b>' + s + ' → ' + t + '</b>：' + path.join(' → ') + '，长度 = <b>' + (path.length - 1) + '</b>', true);
                    setStat('路径：' + path.join(' → ') + '<br>边数：<b>' + (path.length - 1) + '</b>');
                    setPathCache(path);
                } else {
                    log(t + ' 不可达自 ' + s);
                    setPathCache(null);
                }
            } else {
                setPathCache(null);
            }
            yield;
        }

        function* dfsGen(s) {
            const vis = new Set();
            const stack = [];
            function* go(u) {
                hl(2);
                vis.add(u);
                stack.push(u);
                const un = findNode(u);
                un.state = 'active';
                log('访问 <b>' + u + '</b>（入栈，深度 ' + stack.length + '）', true);
                setStat('栈：' + stack.join(' → '));
                yield;
                hl(3);
                const nbs = neighborsOf(u);
                for (const nb of nbs) {
                    const to = nb.to, e = nb.e;
                    if (!vis.has(to)) {
                        hl(4);
                        e.state = 'done';
                        log('&nbsp;&nbsp;' + u + ' → ' + to + ' 未访问，继续深入');
                        yield* go(to);
                    } else {
                        hl(5);
                        log('&nbsp;&nbsp;' + to + ' 已访问，边 ' + u + '→' + to + ' 跳过');
                    }
                }
                hl(6);
                un.state = 'done';
                stack.pop();
                let msg = '<b>' + u + '</b> 的邻接点已穷尽，回溯';
                if (stack.length) msg += '（退回 ' + stack[stack.length - 1] + '）';
                log(msg);
                setStat('栈：' + (stack.length ? stack.join(' → ') : '∅'));
                yield;
            }
            hl(0);
            yield* go(s);
            hl(7);
            log('DFS 结束：共访问 ' + vis.size + ' 个节点', true);
            setStat('完成 ✓ &nbsp;访问 ' + vis.size + '/' + G.nodes.length + ' 节点');
            setPathCache(null);
        }

        function* dijGen(s, t) {
            const d = {}, parent = {}, done = new Set();
            G.nodes.forEach(function (n) { d[n.id] = Infinity; parent[n.id] = null; });
            d[s] = 0;
            G.nodes.forEach(function (n) { n.show = (n.id === s) ? '0' : '∞'; });
            hl(0);
            log('初始化：d[' + s + ']=0，其余 d=∞', true);
            setStat('d: ' + G.nodes.map(n => n.id + '=' + n.show).join(' '));
            yield;
            while (true) {
                hl(1);
                let u = null, best = Infinity;
                G.nodes.forEach(function (n) {
                    if (!done.has(n.id) && d[n.id] < best) { best = d[n.id]; u = n.id; }
                });
                if (u === null) break;
                done.add(u);
                const un = findNode(u);
                un.state = 'active';
                hl(2);
                log('取未确定节点中 d 最小者 <b>' + u + '</b>（d=' + d[u] + '）→ 确定', true);
                yield;
                const nbs = neighborsOf(u);
                for (const nb of nbs) {
                    const to = nb.to, w = nb.w, e = nb.e;
                    if (done.has(to)) continue;
                    const nd = d[u] + w;
                    e.state = 'active';
                    hl(3);
                    if (nd < d[to]) {
                        hl(4);
                        const old = (d[to] === Infinity) ? '∞' : d[to];
                        d[to] = nd; parent[to] = u;
                        findNode(to).state = 'frontier';
                        findNode(to).show = String(nd);
                        log('&nbsp;&nbsp;松弛 ' + u + '→' + to + '：' + old + ' → <b style="color:#d95f2b">' + nd + '</b>');
                    } else {
                        log('&nbsp;&nbsp;松弛 ' + u + '→' + to + '：' + nd + ' ≥ ' + ((d[to] === Infinity) ? '∞' : d[to]) + '，不更新');
                    }
                    setStat('确定集 {' + Array.from(done).join(',') + '}<br>d: ' + G.nodes.map(n => n.id + '=' + n.show).join(' '));
                    yield;
                    e.state = 'idle';
                }
                un.state = 'done';
                // d 值常驻
                un.show = String(d[u]);
                yield;
            }
            hl(5);
            if (t) {
                const path = [];
                let cur = t;
                while (cur) { path.unshift(cur); cur = parent[cur]; }
                if (path[0] !== s) {
                    log(t + ' 不可达自 ' + s);
                    setPathCache(null);
                } else {
                    for (let i = 0; i < path.length - 1; i++) markEdge(path[i], path[i + 1], 'path');
                    log('最短路径 <b>' + s + ' → ' + t + '</b>：' + path.join(' → ') + '，总长 = <b>' + d[t] + '</b>', true);
                    setStat('路径：' + path.join(' → ') + '<br>总长：<b>' + d[t] + '</b>');
                    setPathCache(path);
                }
            } else {
                G.edges.forEach(function (e) {
                    if (parent[e.to] === e.from) e.state = 'path';
                    if (!G.directed && parent[e.from] === e.to) e.state = 'path';
                });
                log('最短路径树构建完毕（自 ' + s + '）', true);
                setStat('完成 ✓ &nbsp;d: ' + G.nodes.map(n => n.id + '=' + n.show).join(' '));
                setPathCache(null);
            }
            // 所有 d 常驻
            G.nodes.forEach(function (n) {
                if (d[n.id] !== Infinity) n.show = String(d[n.id]);
            });
            yield;
        }

        function* mstGen() {
            if (G.directed) { log('Kruskal 需要无向图，请先切换为无向图', true); return; }
            const sorted = G.edges.slice().sort(function (a, b) { return a.w - b.w; });
            const uf = {};
            G.nodes.forEach(function (n) { uf[n.id] = n.id; });
            function find(x) { return uf[x] === x ? x : (uf[x] = find(uf[x])); }
            let total = 0, cnt = 0;
            hl(0);
            log('将 ' + G.edges.length + ' 条边按权重升序排序', true);
            setStat('排序：' + sorted.map(e => e.from + e.to + ':' + e.w).join('  '));
            yield;
            hl(1);
            for (const e of sorted) {
                const ra = find(e.from), rb = find(e.to);
                e.state = 'active';
                hl(2);
                log('考察边 <b>' + e.from + '—' + e.to + '</b>（w=' + e.w + '）', true);
                yield;
                if (ra !== rb) {
                    hl(3);
                    uf[ra] = rb;
                    e.state = 'path';
                    total += e.w; cnt++;
                    findNode(e.from).state = 'done'; findNode(e.to).state = 'done';
                    log('&nbsp;&nbsp;不同分量 → <b>选入 MST</b>（总权 ' + total + '）');
                } else {
                    hl(5);
                    e.state = 'idle';
                    log('&nbsp;&nbsp;已连通 → <b>成环，舍弃</b>');
                }
                setStat('已选 ' + cnt + ' 条 · 总权 <b>' + total + '</b>');
                yield;
                if (cnt === G.nodes.length - 1) {
                    hl(6);
                    log('已选 n−1 = ' + cnt + ' 条边，MST 提前完成', true);
                    break;
                }
            }
            hl(6);
            log('MST 完成：' + cnt + ' 条边，总权重 = <b>' + total + '</b>', true);
            setStat('完成 ✓ &nbsp;' + cnt + ' 条边 · 总权 <b>' + total + '</b>');
            setPathCache(null);
            yield;
        }

        function* topoGen() {
            if (!G.directed) {
                log('拓扑排序需要<strong>有向图</strong>，请切换为有向图', true);
                setStat('需要有向图');
                return;
            }
            const indeg = {};
            G.nodes.forEach(function (n) { indeg[n.id] = 0; n.show = '0'; });
            G.edges.forEach(function (e) { indeg[e.to] = (indeg[e.to] || 0) + 1; });
            G.nodes.forEach(function (n) { n.show = String(indeg[n.id]); });
            hl(0);
            log('计算入度：' + G.nodes.map(n => n.id + '=' + indeg[n.id]).join(' '), true);
            setStat('入度：' + G.nodes.map(n => n.id + '=' + indeg[n.id]).join(' '));
            yield;

            const queue = G.nodes.filter(n => indeg[n.id] === 0).map(n => n.id);
            queue.forEach(function (id) { findNode(id).state = 'frontier'; });
            const order = [];
            hl(1);
            log('初始入队（入度 0）：<b>[' + queue.join(' ') + ']</b>', true);
            setStat('队列：<span class="q">[' + queue.join(' ') + ']</span>');
            yield;

            while (queue.length) {
                hl(3);
                const u = queue.shift();
                order.push(u);
                const un = findNode(u);
                un.state = 'active';
                log('出队 <b>' + u + '</b> → 写入拓扑序', true);
                setStat('序：' + order.join(' → ') + '<br>队列：<span class="q">[' + queue.join(' ') + ']</span>');
                yield;
                hl(5);
                G.edges.forEach(function (e) {
                    if (e.from !== u) return;
                    e.state = 'active';
                    indeg[e.to]--;
                    findNode(e.to).show = String(indeg[e.to]);
                    log('&nbsp;&nbsp;边 ' + u + '→' + e.to + '，' + e.to + ' 入度 → ' + indeg[e.to]);
                    if (indeg[e.to] === 0) {
                        hl(7);
                        queue.push(e.to);
                        findNode(e.to).state = 'frontier';
                        log('&nbsp;&nbsp;&nbsp;&nbsp;' + e.to + ' 入度归零 → 入队');
                    }
                });
                setStat('序：' + order.join(' → ') + '<br>队列：<span class="q">[' + queue.join(' ') + ']</span><br>入度：' + G.nodes.map(n => n.id + '=' + indeg[n.id]).join(' '));
                yield;
                G.edges.forEach(function (e) { if (e.from === u) e.state = 'done'; });
                un.state = 'done';
                yield;
            }
            hl(8);
            if (order.length < G.nodes.length) {
                log('拓扑序长度 ' + order.length + ' &lt; n=' + G.nodes.length + ' → <b>存在有向环</b>，无法完成排序', true);
                setStat('存在环 ✗ · 仅得到 ' + order.length + '/' + G.nodes.length);
                G.nodes.forEach(function (n) {
                    if (n.state !== 'done') n.state = 'frontier';
                });
            } else {
                log('拓扑序：<b>' + order.join(' → ') + '</b>', true);
                setStat('完成 ✓ &nbsp;' + order.join(' → '));
            }
            setPathCache(null);
            yield;
        }

        /* ---------- 路径回放 ---------- */
        btnReplay.addEventListener('click', function () {
            if (!PATH_CACHE || !PATH_CACHE.nodes) return;
            const path = PATH_CACHE.nodes;
            // 清边高亮后逐步点亮
            G.edges.forEach(function (e) { if (e.state === 'path') e.state = 'idle'; });
            let i = 0;
            function tick() {
                if (i >= path.length - 1) {
                    toast('路径回放完毕');
                    return;
                }
                markEdge(path[i], path[i + 1], 'path');
                const ni = findNode(path[i]), nj = findNode(path[i + 1]);
                if (ni) ni.state = 'done';
                if (nj) nj.state = 'active';
                setStat('回放：' + path.slice(0, i + 2).join(' → '));
                i++;
                setTimeout(function () {
                    if (nj) nj.state = 'done';
                    tick();
                }, 500 / P.speed);
            }
            path.forEach(function (id) { const n = findNode(id); if (n) n.state = 'frontier'; });
            tick();
        });

        /* ---------- 播放控制 ---------- */
        const btnRun = document.getElementById('btnRun'), btnStep = document.getElementById('btnStep'),
            btnPause = document.getElementById('btnPause'), btnReset = document.getElementById('btnReset');

        function startAlgo() {
            if (!G.nodes.length) { toast('请先生成图形'); return; }
            resetAlgo();
            takeSnap();
            const s = document.getElementById('selStart').value;
            const t = document.getElementById('selEnd').value;
            if (algo === 'mst') P.gen = mstGen();
            else if (algo === 'dij') P.gen = dijGen(s, t);
            else if (algo === 'bfs') P.gen = bfsGen(s, t);
            else if (algo === 'topo') P.gen = topoGen();
            else P.gen = dfsGen(s);
            P.done = false; P.running = true;
            [btnStep, btnPause, btnReset].forEach(function (b) { b.disabled = false; });
            btnRun.disabled = true;
            btnReplay.disabled = true;
            PATH_CACHE = null;
            clearStatLog();
            renderPseudo(-1);
            step();
            schedule();
        }
        function step() {
            if (!P.gen || P.done) return;
            const r = P.gen.next();
            P.stepN++;
            if (r.done) {
                P.done = true; P.running = false;
                clearTimeout(P.timer);
                btnRun.disabled = false; btnPause.disabled = true;
                log('— 演算结束 —', true);
            }
        }
        function schedule() {
            clearTimeout(P.timer);
            if (!P.running || P.done) return;
            P.timer = setTimeout(function () { step(); schedule(); }, 680 / P.speed);
        }
        function resetAlgo() {
            clearTimeout(P.timer);
            P.gen = null; P.done = true; P.running = false;
            restoreSnap();
            G.nodes.forEach(function (n) { n.state = 'idle'; n.show = null; });
            G.edges.forEach(function (e) { e.state = 'idle'; });
            [btnStep, btnPause, btnReset].forEach(function (b) { b.disabled = true; });
            btnRun.disabled = false;
            btnReplay.disabled = !PATH_CACHE;
            btnPause.textContent = '暂停';
            clearStatLog();
            renderPseudo(-1);
        }
        btnRun.addEventListener('click', startAlgo);
        btnStep.addEventListener('click', function () {
            if (P.gen && !P.done) { P.running = false; btnPause.disabled = true; btnPause.textContent = '继续'; step(); }
        });
        btnPause.addEventListener('click', function () {
            if (P.running) { P.running = false; clearTimeout(P.timer); btnPause.textContent = '继续'; }
            else { P.running = true; btnPause.textContent = '暂停'; schedule(); }
        });
        btnReset.addEventListener('click', function () { PATH_CACHE = null; btnReplay.disabled = true; resetAlgo(); });
        document.getElementById('speed').addEventListener('input', function (ev) {
            P.speed = parseFloat(ev.target.value);
            document.getElementById('spdVal').textContent = P.speed.toFixed(2).replace(/0$/, '') + '×';
        });

        /* Space 单步 */
        document.addEventListener('keydown', function (ev) {
            if (ev.target.matches('input,textarea,select')) return;
            if (ev.code === 'Space') {
                ev.preventDefault();
                if (P.gen && !P.done) { P.running = false; btnPause.textContent = '继续'; step(); }
            }
        });

        function bindToggle(id, key, cb) {
            const box = document.getElementById(id);
            box.addEventListener('click', function (ev) {
                const b = ev.target.closest('button'); if (!b) return;
                const v = b.dataset.v === '1';
                if (G[key] === v) return;
                G[key] = v;
                box.querySelectorAll('button').forEach(function (x) { x.classList.toggle('on', x === b); });
                if (cb) cb();
            });
        }
        bindToggle('tgDir', 'directed', function () {
            refreshStructure();
            toast(G.directed ? '已切换为有向图' : '已切换为无向图');
        });
        bindToggle('tgW', 'weighted', function () { refreshStructure(); });

        document.getElementById('btnBuild').addEventListener('click', function () {
            buildGraph(document.getElementById('edges').value, true);
            toast('已生成：' + G.nodes.length + ' 节点 / ' + G.edges.length + ' 边');
        });
        document.getElementById('btnLayout').addEventListener('click', strongLayout);
        document.querySelectorAll('.presets .chip[data-p]').forEach(function (c) {
            c.addEventListener('click', function () {
                const text = PRESETS[c.dataset.p];
                document.getElementById('edges').value = text;
                G.view = { x: 0, y: 0, scale: 1 };
                buildGraph(text, false);
                if (c.dataset.p === 'grid') {
                    G.nodes.forEach(function (n) {
                        const i = n.id.charCodeAt(0) - 65;
                        n.x = 140 + (i % 4) * 160; n.y = 120 + Math.floor(i / 4) * 150; n.fixed = true;
                    });
                    sleepNow();
                }
                toast('已载入预设：' + c.textContent);
            });
        });
        document.getElementById('exlist').addEventListener('click', function (ev) {
            const b = ev.target.closest('.exchip'); if (!b) return;
            const ex = EXAMPLES.find(function (x) { return x.id === b.dataset.ex; });
            if (ex) loadExample(ex);
        });

        /* ---------- 初始化 ---------- */
        resize();
        renderTopologies();
        renderExamples();
        renderPseudo(-1);
        document.getElementById('edges').value = PRESETS.classic;
        buildGraph(PRESETS.classic, false);
        requestAnimationFrame(draw);
        setTimeout(strongLayout, 60);
    </script>
</body>

</html>
